img,svg{display:block}
button{font:inherit;cursor:pointer}
html,body{overflow-x:clip;max-width:100%}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
main.wrap{padding-top:4px}

/* 顶栏 */
/* #vue-app 只包住顶栏与 Hero，而 React 的 main.wrap 在其外。
   sticky 元素无法超出父容器——顶栏会被限制在 #vue-app 高度内、滚过即失效。
   display:contents 让 #vue-app 不生成盒模型，顶栏直接相对视口定位，同时不改 DOM 结构。 */
#vue-app{display:contents}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.62);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid rgba(255,255,255,.7)}
.topbar-in{max-width:1040px;margin:0 auto;padding:0 20px;height:60px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:11px;font-weight:600;font-size:27px;letter-spacing:.06em;white-space:nowrap}
/* 品牌图标：圆角渐变徽章 + 暖色光晕，突出「做饭」主题 */
.brand-ic{
  width:40px;height:40px;flex:none;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  color:#FFF8EC;
  background:linear-gradient(145deg,#C24A22 0%,#993C1D 52%,#7A2C12 100%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.42),
    inset 0 -1px 0 rgba(0,0,0,.14),
    0 6px 16px -4px rgba(122,44,18,.52),
    0 2px 5px rgba(122,44,18,.24);
  transition:transform .3s cubic-bezier(.2,.7,.3,1),box-shadow .3s ease;
}
.brand-ic svg{width:23px;height:23px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.22))}
.topbar .brand:hover .brand-ic{
  transform:rotate(-6deg) scale(1.06);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.5),
    inset 0 -1px 0 rgba(0,0,0,.14),
    0 10px 22px -4px rgba(122,44,18,.6),
    0 0 0 4px rgba(217,164,65,.22);
}
@media (prefers-reduced-motion:reduce){
  .brand-ic{transition:none}
  .topbar .brand:hover .brand-ic{transform:none}
}
/* 发光流动字体 */
.brand .glow{
  position:relative;
  background:linear-gradient(100deg,#2C2C2A 0%,#8A8778 18%,#993C1D 32%,#D9A441 46%,#993C1D 60%,#8A8778 74%,#2C2C2A 90%);
  background-size:260% 100%;
  -webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;
  animation:flow 5.5s linear infinite;
  text-shadow:0 0 14px rgba(153,60,29,.0);
  filter:drop-shadow(0 0 10px rgba(153,60,29,.30)) drop-shadow(0 0 26px rgba(217,164,65,.16));
}
@keyframes flow{
  0%{background-position:0% 50%}
  100%{background-position:260% 50%}
}
@media (prefers-reduced-motion:reduce){
  .brand .glow{animation:none;filter:none}
}
@media (max-width:520px){
  .topbar-in{gap:8px;padding:0 12px;height:56px}
  .brand{font-size:20px;gap:8px}
  .brand-ic{width:32px;height:32px;border-radius:10px}
  .brand-ic svg{width:19px;height:19px}
  .nav button{padding:6px 9px;font-size:13px}
  .wrap{padding:0 14px}
}
.nav{margin-left:auto;display:flex;gap:6px}
.nav button{border:0;background:transparent;color:#1F1F1D;font-size:14px;padding:7px 13px;border-radius:8px}
.nav button:hover{background:#F0EDE4;color:#2C2C2A}
.nav button.on{background:#2C2C2A;color:#FBFAF7}

/* Hero */
.hero{position:relative;padding:56px 0 30px;isolation:isolate}
/* 玻璃要透出东西才有意义：底层铺暖色柔光 */
.hero::before{
  content:"";position:absolute;inset:-60px -100px;z-index:-1;pointer-events:none;
  background:
    radial-gradient(48% 62% at 6% 6%, rgba(217,164,65,.42), transparent 68%),
    radial-gradient(56% 68% at 98% 0%, rgba(153,60,29,.34), transparent 70%),
    radial-gradient(64% 76% at 54% 118%, rgba(44,44,42,.10), transparent 74%);
  filter:blur(30px);
}
.hero-card{
  position:relative;overflow:hidden;max-width:920px;
  margin-bottom:34px;
  padding:28px 32px 26px;border-radius:20px;
  background:linear-gradient(152deg, rgba(255,255,255,.74), rgba(251,250,247,.46) 56%, rgba(243,240,232,.60));
  -webkit-backdrop-filter:blur(18px) saturate(1.5);
  backdrop-filter:blur(18px) saturate(1.5);
  border:1px solid rgba(255,255,255,.9);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.95),
    inset 0 -1px 0 rgba(153,60,29,.06),
    0 26px 52px -22px rgba(44,44,42,.30),
    0 3px 12px rgba(44,44,42,.07);
  transition:transform .3s cubic-bezier(.2,.7,.3,1), box-shadow .3s ease, border-color .3s ease;
}
/* 鼠标悬浮：卡片上浮 + 阴影加深 */
.hero-card:hover{
  transform:translateY(-4px);
  border-color:rgba(255,255,255,1);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,1),
    inset 0 -1px 0 rgba(153,60,29,.12),
    0 34px 64px -22px rgba(44,44,42,.34),
    0 8px 22px rgba(153,60,29,.10);
}
/* 悬浮时斜向高光扫过卡片（独立图层，避免与常驻高光叠成白块） */
.hero-card::before{
  content:"";position:absolute;top:-40%;left:-50%;width:42%;height:180%;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.42) 48%, transparent 66%);
  transform:rotate(14deg);pointer-events:none;
  mix-blend-mode:soft-light;opacity:0;
  transition:opacity .2s ease, left .7s cubic-bezier(.35,0,.2,1);
}
.hero-card:hover::before{opacity:1;left:78%}
/* 常驻斜向高光：玻璃体积感（弱，仅作底光） */
.hero-card::after{
  content:"";position:absolute;top:-70%;left:-34%;width:66%;height:240%;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.72) 44%, rgba(255,255,255,.14) 60%, transparent);
  transform:rotate(18deg);pointer-events:none;
  mix-blend-mode:screen;
}
.hero h1{
  position:relative;margin:0 0 14px;font-size:40px;line-height:1.25;font-weight:600;letter-spacing:.01em;
  transition:letter-spacing .3s ease;
}
.hero-card:hover h1{letter-spacing:.035em}
.hero p.lead{position:relative;margin:0;font-size:16.5px;line-height:1.85;color:#1F1F1D;max-width:640px;transition:color .3s ease}
.hero-card:hover p.lead{color:#2C2C2A}
/* 悬浮动效降级：关掉位移与扫光，保留静态的描边与暖色调 */
@media (prefers-reduced-motion:reduce){
  .hero-card{transition:none}
  .hero-card:hover{transform:none;box-shadow:inset 0 1px 0 rgba(255,255,255,1),inset 0 -1px 0 rgba(153,60,29,.12),0 26px 52px -22px rgba(44,44,42,.30)}
  .hero-card::before{display:none}
  .hero h1{transition:none}
  .hero-card:hover h1{letter-spacing:.01em}
  .hero p.lead{transition:none}
}

/* 艺术字：发光流动 */
.hero h1 .art{
  position:relative;display:inline-block;
  background:linear-gradient(100deg,#2C2C2A 0%,#993C1D 22%,#D9A441 40%,#E8B84B 48%,#993C1D 62%,#8A8778 80%,#2C2C2A 96%);
  background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;
  animation:flow 6s linear infinite;
  filter:drop-shadow(0 0 14px rgba(217,164,65,.42)) drop-shadow(0 0 34px rgba(153,60,29,.22));
}
@supports not (background-clip:text){
  .hero h1 .art{background:none;color:#993C1D;-webkit-text-fill-color:currentColor;animation:none;filter:none}
}
@supports not (-webkit-background-clip:text){
  .hero h1 .art{background:none;color:#993C1D;-webkit-text-fill-color:currentColor;animation:none;filter:none}
}

/* 搜索 */
.searchbox{position:relative;max-width:520px}
.searchbox>svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:#1F1F1D;pointer-events:none}
#searchInput{width:100%;padding:12px 40px 12px 42px;font-size:15px;color:#2C2C2A;background:#fff;border:1px solid #DDD9CE;border-radius:10px;outline:none;font-family:inherit}
#searchInput::placeholder{color:#1F1F1D}
#searchInput:focus{border-color:#B4B2A9;box-shadow:0 0 0 3px rgba(44,44,42,.06)}
.searchbox .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:26px;height:26px;border:0;border-radius:7px;background:transparent;color:#1F1F1D;font-size:16px;line-height:1;display:none}
.searchbox.hasval .clear{display:block}
.searchbox .clear:hover{background:#F0EDE4;color:#2C2C2A}
.searchhint{margin:10px 0 0;font-size:12.5px;color:#1F1F1D;padding-left:2px}
.searchhint kbd{font-family:inherit;font-size:12px;background:#F0EDE4;border:1px solid #E3DFD4;border-radius:5px;padding:1px 5px;color:#1F1F1D}

/* 筛选 */
.filters{display:flex;align-items:center;gap:10px;margin:22px 0 4px;flex-wrap:wrap}
.filters .lbl{font-size:13px;color:#1F1F1D;margin-right:2px}
.chip{border:1px solid #DDD9CE;background:#fff;color:#1F1F1D;font-size:13px;padding:6px 14px;border-radius:999px}
.chip:hover{border-color:#B4B2A9;color:#2C2C2A}
.chip.on{background:#2C2C2A;border-color:#2C2C2A;color:#FBFAF7}

/* 计数 */
.count{font-size:13px;color:rgba(255,255,255,.92);margin:18px 0 0;text-shadow:0 1px 3px rgba(16,72,102,.35)}
.count b{color:#fff;font-weight:600}

/* 卡片 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;padding-top:18px}
.card{background:rgba(255,255,255,.90);border:1px solid rgba(255,255,255,.85);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;-webkit-backdrop-filter:blur(10px) saturate(1.15);backdrop-filter:blur(10px) saturate(1.15);transition:border-color .15s,transform .15s,box-shadow .15s}
.card:hover{border-color:#B4B2A9;transform:translateY(-3px);box-shadow:0 8px 22px rgba(44,44,42,.07)}
.card-top{padding:18px 20px 0;display:flex;align-items:center;justify-content:space-between}
.card-idx{font-size:12px;color:#1F1F1D;letter-spacing:.1em;font-variant-numeric:tabular-nums}
.card-idx b{color:#1F1F1D;font-weight:600}
.card-no{padding:16px 20px 0;font-size:12.5px;color:#1F1F1D;display:flex;gap:5px;flex-wrap:wrap}
.card-no span{background:#F4F2EB;border-radius:5px;padding:2px 7px}
.card h3{margin:10px 0 4px;padding:0 20px;font-size:22px;font-weight:600;color:#2C2C2A;line-height:1.35}
.card .desc{margin:0;padding:0 20px;font-size:14px;color:#1F1F1D}
.card .meta{margin:16px 20px 0;padding-top:14px;border-top:1px dashed #ECE9E0;display:flex;flex-wrap:wrap;gap:14px 18px;font-size:13px;color:#1F1F1D}
.meta i{display:flex;align-items:center;gap:5px;font-style:normal;white-space:nowrap}
.meta svg{width:14px;height:14px;color:#1F1F1D;flex:none}
.card .foot{margin:auto 20px 18px;padding-top:14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.diff{font-size:12.5px;color:#993C1D;background:#FAECE7;border-radius:6px;padding:3px 9px;letter-spacing:.04em}
.diff .off{opacity:.32}
.card .open{display:inline-flex;align-items:center;gap:5px;background:none;border:0;color:#993C1D;font-size:13.5px;font-weight:500;padding:4px 0;white-space:nowrap}
.card .open svg{width:14px;height:14px;transition:transform .18s}
.card:hover .open{color:#712B13}
.card:hover .open svg{transform:translateX(3px)}

/* 详情正文容器 */
.detail{margin:0;padding:0}

.detail ol,.detail ul{margin:0;padding-left:20px;font-size:14px;color:#1F1F1D}
.detail li{margin-bottom:6px}
.detail .tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.detail table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:280px}
.detail th,.detail td{text-align:left;padding:7px 10px;border-bottom:1px solid #F0EDE4;vertical-align:top}
.detail th{color:#1F1F1D;font-weight:400;width:38%;white-space:nowrap}
.detail tr:last-child th,.detail tr:last-child td{border-bottom:0}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:5px;margin:0 5px 5px 0;background:#F4F2EB;color:#1F1F1D}
.tip{margin:0;padding:10px 12px;background:#FAECE7;border-left:3px solid #993C1D;border-radius:0 7px 7px 0;font-size:13.5px;color:#712B13}

/* 折叠区块 */
.collapse{margin-top:14px;border:1px solid #EDEAE2;border-radius:12px;background:rgba(255,255,255,.55);overflow:hidden}
.collapse:first-child{margin-top:0}
.collapse-h{
  display:flex;align-items:center;gap:9px;width:100%;text-align:left;
  padding:13px 16px;border:0;background:transparent;cursor:pointer;
  font-size:15px;font-weight:600;color:#2C2C2A;font-family:inherit;
  transition:background .18s ease;
}
.collapse-h:hover{background:rgba(255,255,255,.75)}
/* 图标槽：固定 18px 宽，无图标时也占位，保证六个标题文字左对齐 */
.collapse-h .ico{width:18px;height:18px;flex:none;display:flex;align-items:center;justify-content:center;color:#993C1D}
.collapse-h .ico svg{width:18px;height:18px}
.collapse-h .collapse-label{flex:1 1 auto;min-width:0}
.collapse-h .chev{margin-left:auto;width:16px;height:16px;color:#1F1F1D;flex:none;transition:transform .25s cubic-bezier(.2,.7,.3,1),color .18s ease}
.collapse-h:hover .chev{color:#993C1D}
.collapse.on .collapse-h .chev{transform:rotate(180deg)}
.collapse-body{padding:0 16px 16px;border-top:1px dashed #EDEAE2;animation:unfold .24s cubic-bezier(.2,.7,.3,1)}
.collapse-body[hidden]{display:none}
@keyframes unfold{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.collapse-body{animation:none}}
.collapse-t{margin:0}
.collapse-body .steps>li:first-child{padding-top:0}
@media (max-width:640px){
  .collapse{margin-top:12px;border-radius:10px}
  .collapse-h{padding:12px 13px;font-size:14.5px;gap:8px}
  .collapse-body{padding:0 13px 14px}
}

/* 食材清单：2 列表格 + 分组小标题可折叠 */
.inggroup{margin-top:14px}
.inggroup:first-child{margin-top:0}
.ingsub-t{margin:0}
/* 分组标题栏（按钮） */
.ingsub-h{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:8px 11px;border:0;border-radius:8px;
  background:rgba(250,236,231,.55);
  cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;
  color:#993C1D;letter-spacing:.04em;
  transition:background .18s ease;
}
.ingsub-h:hover{background:rgba(250,236,231,.98)}
.ingsub-h::before{content:"";width:3px;height:12px;background:#993C1D;border-radius:2px;flex:none}
.ingsub-h .ingsub-name{flex:1 1 auto;min-width:0}
.ingsub-h .ingsub-n{
  font-size:11.5px;font-weight:400;letter-spacing:0;
  color:#1F1F1D;opacity:.62;font-variant-numeric:tabular-nums;
}
.ingsub-h .chev{
  width:14px;height:14px;flex:none;color:#993C1D;
  transition:transform .25s cubic-bezier(.2,.7,.3,1);
}
.ingsub.on .ingsub-h .chev{transform:rotate(180deg)}
/* 折叠体：grid-template-rows 1fr↔0fr 实现高度过渡，配合 opacity 做下拉淡出 */
.ingsub-body{
  display:grid;grid-template-rows:1fr;opacity:1;visibility:visible;
  transition:grid-template-rows .32s cubic-bezier(.2,.7,.3,1),opacity .28s ease,visibility 0s 0s;
}
.ingsub-body>.ingsub-in{overflow:hidden;min-height:0}
.ingsub-body>.ingsub-in>.ingsub-pad{padding-top:8px}
.ingsub:not(.on) .ingsub-body{
  grid-template-rows:0fr;opacity:0;visibility:hidden;
  /* visibility 延迟到收起动画结束再切换，否则内容会瞬间消失、看不到淡出 */
  transition:grid-template-rows .3s cubic-bezier(.2,.7,.3,1),opacity .22s ease,visibility 0s .3s;
}
@media (prefers-reduced-motion:reduce){
  .ingsub-h{transition:none}
  .ingsub-h .chev{transition:none}
  .ingsub-body,.ingsub:not(.on) .ingsub-body{transition:none}
}
.ingtable{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;table-layout:fixed;
  border:1px solid #EDEAE2;border-radius:10px;overflow:hidden;background:rgba(255,255,255,.5)}
.ingtable th{width:34%;text-align:left;font-weight:500;color:#2C2C2A;padding:9px 12px;border-bottom:1px solid #F0EDE4;vertical-align:top;word-break:break-word}
.ingtable td{color:#993C1D;padding:9px 12px;border-bottom:1px solid #F0EDE4;vertical-align:top;white-space:nowrap}
.ingtable tr:last-child th,.ingtable tr:last-child td{border-bottom:0}
.ingtable tbody tr:nth-child(even){background:rgba(252,251,248,.7)}
.ingtable .note{display:block;grid-column:1/-1;font-size:12.5px;color:#1F1F1D;font-weight:400;margin-top:3px;white-space:normal}
@media (max-width:640px){
  .ingtable th{width:42%;padding:8px 10px;font-size:13.5px}
  .ingtable td{padding:8px 10px;font-size:13.5px;white-space:normal}
}

/* 步骤 */
.steps{counter-reset:st;list-style:none;padding-left:0}
.steps>li{padding:14px 0;border-bottom:1px solid #F4F2EB}
.steps>li:last-child{border-bottom:0}
.steps>li::before{counter-increment:st;content:counter(st,decimal-leading-zero);display:inline-block;width:26px;font-size:12px;color:#1F1F1D;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.stephead{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.stephead b{font-size:15px;font-weight:600;color:#2C2C2A}
.stephead span{font-size:12.5px;color:#993C1D;background:#FAECE7;border-radius:5px;padding:2px 7px}
.steps ul{margin-top:8px;padding-left:18px}
.steps ul li{font-size:13.5px;color:#1F1F1D;margin-bottom:4px}

/* 空状态 */
.empty{padding:56px 20px 8px;text-align:center;color:#1F1F1D}
.empty svg{width:44px;height:44px;margin:0 auto 14px;color:#1F1F1D}
.empty p{margin:0 0 16px;font-size:15px}
.empty button{border:1px solid #DDD9CE;background:#fff;color:#1F1F1D;font-size:13.5px;padding:8px 18px;border-radius:8px}
.empty button:hover{border-color:#B4B2A9;color:#2C2C2A}

/* 图片画廊 */
.gal{position:relative;border-radius:12px;overflow:hidden;background:#fff;border:1px solid #E8E5DC}
.gal-img{width:100%;height:auto;aspect-ratio:16/10;object-fit:cover;background:#F4F2EB}
.gal-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:34px 20px;background:rgba(255,255,255,.82);border:1px dashed #C9C5BA;border-radius:12px;color:#1F1F1D;text-align:center}
.gal-empty-ic{display:flex;justify-content:center;margin-bottom:6px}
.gal-empty-ic svg{width:30px;height:30px;color:#1F1F1D}
.gal-empty-ic svg{width:30px;height:30px}
.gal-empty p{margin:6px 0 0;font-size:14px;color:#1F1F1D}
.gal-empty small{margin:0;font-size:12.5px}
.gal-nav{position:absolute;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;border-radius:50%;background:rgba(251,250,247,.9);color:#2C2C2A;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 5px rgba(44,44,42,.16)}
.gal-nav:hover{background:#FBFAF7}
.gal-nav.prev{left:10px}
.gal-nav.next{right:10px}
.gal-dots{position:absolute;left:0;right:0;bottom:10px;display:flex;gap:6px;justify-content:center}
.gal-dot{width:6px;height:6px;padding:0;border:0;border-radius:50%;background:rgba(251,250,247,.55)}
.gal-dot.on{background:#993C1D}

/* 详情页 */
.dpage{padding:6px 0 40px;animation:fadein .22s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.dpage{animation:none}}
/* 悬浮动效降级：保留颜色反馈，去掉位移与扫光 */
@media (prefers-reduced-motion:reduce){
  .hero-card,.hero h1,.hero p.lead{transition:none}
  .hero-card:hover{transform:none}
  .hero-card:hover::before{opacity:0}
  .hero-card:hover h1{letter-spacing:.01em}
}
/* 详情页头部卡片：玻璃质感，悬浮时循环闪动 */
.dcard{
  position:relative;overflow:hidden;
  margin:0 0 30px;padding:24px 26px 22px;border-radius:18px;
  background:linear-gradient(152deg, rgba(255,255,255,.78), rgba(251,250,247,.52) 56%, rgba(243,240,232,.64));
  -webkit-backdrop-filter:blur(18px) saturate(1.5);
  backdrop-filter:blur(18px) saturate(1.5);
  border:1px solid rgba(255,255,255,.9);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.95),
    inset 0 -1px 0 rgba(153,60,29,.06),
    0 20px 44px -20px rgba(44,44,42,.30),
    0 3px 12px rgba(44,44,42,.07);
  transition:transform .3s cubic-bezier(.2,.7,.3,1), border-color .3s ease, box-shadow .3s ease;
}
/* 悬浮：轻微上浮 + 阴影脉冲（闪动的主体） */
.dcard:hover{
  transform:translateY(-3px);
  border-color:rgba(255,255,255,1);
  animation:dcardGlow 1.5s ease-in-out infinite;
}
@keyframes dcardGlow{
  0%,100%{
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,1),
      inset 0 -1px 0 rgba(153,60,29,.10),
      0 26px 52px -22px rgba(44,44,42,.34),
      0 4px 14px rgba(153,60,29,.08);
  }
  50%{
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,1),
      inset 0 -1px 0 rgba(153,60,29,.16),
      0 30px 60px -22px rgba(44,44,42,.40),
      0 0 0 3px rgba(217,164,65,.20),
      0 6px 20px rgba(153,60,29,.16);
  }
}
/* 闪动扫光：窄光带循环掠过（soft-light 避免糊成白块） */
.dcard::before{
  content:"";position:absolute;top:-40%;left:-55%;width:38%;height:180%;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.62) 46%, rgba(255,255,255,.18) 62%, transparent);
  transform:rotate(14deg);pointer-events:none;
  mix-blend-mode:soft-light;opacity:0;
}
.dcard:hover::before{animation:dcardSheen 1.6s ease-in-out infinite}
@keyframes dcardSheen{
  0%{left:-55%;opacity:0}
  18%{opacity:1}
  62%{left:118%;opacity:1}
  100%{left:118%;opacity:0}
}
/* 常驻弱底光，垫出玻璃厚度 */
.dcard::after{
  content:"";position:absolute;top:-70%;left:-30%;width:60%;height:240%;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.30) 50%, transparent);
  transform:rotate(18deg);pointer-events:none;mix-blend-mode:soft-light;
}
.dcard .dtitle{margin-bottom:10px}
.dcard .ddesc{margin-bottom:16px}
.dcard .dmeta{margin-bottom:16px}
.dcard .dtags{margin:0}
@media (prefers-reduced-motion:reduce){
  .dcard{transition:none}
  .dcard:hover{transform:none;animation:none}
  .dcard:hover::before{animation:none;opacity:0}
}
.dhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.dback{display:inline-flex;align-items:center;gap:6px;border:1px solid #DDD9CE;background:#fff;color:#1F1F1D;font-size:13.5px;padding:8px 14px;border-radius:8px}
.dback:hover{border-color:#B4B2A9;color:#2C2C2A}
.dback svg{width:15px;height:15px}
.dcrumb{font-size:12.5px;color:#1F1F1D;letter-spacing:.04em}
.dtitle{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 8px}
.dno{font-size:13px;color:#1F1F1D;letter-spacing:.12em;font-variant-numeric:tabular-nums}
/* 详情页菜名：浅蓝色发亮艺术字（渐变裁剪 + 流光位移 + 呼吸发光）
   卡片是浅色玻璃底 → 渐变必须整体偏深、高光段不可过白，否则某相位下字会「消失」；
   另加一圈深蓝紧贴描边（小半径高不透明 drop-shadow）锁定字缘。 */
.dtitle h1{
  position:relative;margin:0;font-size:34px;line-height:1.25;font-weight:700;letter-spacing:.01em;
  background:linear-gradient(100deg,#0B3F63 0%,#12608F 16%,#2E8FC8 34%,#7ECBF0 47%,#2E8FC8 60%,#12608F 78%,#0B3F63 94%);
  background-size:280% 100%;
  -webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;
  animation:titleFlow 5.5s linear infinite, titleGlow 2.6s ease-in-out infinite;
}
@keyframes titleFlow{
  0%{background-position:0% 50%}
  100%{background-position:280% 50%}
}
@keyframes titleGlow{
  0%,100%{filter:drop-shadow(0 1px 1px rgba(11,63,99,.55)) drop-shadow(0 0 6px rgba(46,143,200,.70)) drop-shadow(0 0 16px rgba(18,96,143,.48))}
  50%{filter:drop-shadow(0 1px 1px rgba(11,63,99,.55)) drop-shadow(0 0 12px rgba(126,203,240,.95)) drop-shadow(0 0 26px rgba(46,143,200,.70)) drop-shadow(0 0 46px rgba(18,96,143,.46))}
}
/* 不支持背景裁剪时回退为纯蓝实色，保证可读 */
@supports not (background-clip:text){
  .dtitle h1{background:none;color:#12608F;-webkit-text-fill-color:currentColor;animation:none;filter:none}
}
@supports not (-webkit-background-clip:text){
  .dtitle h1{background:none;color:#12608F;-webkit-text-fill-color:currentColor;animation:none;filter:none}
}
@media (prefers-reduced-motion:reduce){
  .dtitle h1{animation:none;filter:drop-shadow(0 1px 1px rgba(11,63,99,.5)) drop-shadow(0 0 10px rgba(46,143,200,.45))}
}
.ddesc{margin:0 0 16px;font-size:15px;color:#1F1F1D;max-width:640px}
.dmeta{margin:0 0 14px;padding:0;border:0;display:flex;flex-wrap:wrap;gap:12px 20px;font-size:13.5px;color:#1F1F1D}
.dtags{margin:0 0 26px}
.dsec{margin-top:30px;padding-top:24px;border-top:1px solid rgba(255,255,255,.42)}
.dsec-body{
  margin-top:18px;padding:22px 24px 24px;border-radius:16px;
  background:linear-gradient(160deg, rgba(255,255,255,.88), rgba(251,250,247,.80));
  -webkit-backdrop-filter:blur(14px) saturate(1.2);
  backdrop-filter:blur(14px) saturate(1.2);
  border:1px solid rgba(255,255,255,.85);
  box-shadow:0 16px 36px -20px rgba(16,72,102,.5);
}
.dsec-t{margin:0 0 14px;font-size:18px;font-weight:600;color:#2C2C2A;display:flex;align-items:center;gap:8px}
.dsec-t::before{content:"";width:4px;height:16px;background:#993C1D;border-radius:2px;flex:none}
.dsec .detail{margin:0;padding:0;border:0}

@media (max-width:640px){
  .hero{padding:34px 0 22px}
  .hero-card{padding:22px 20px 20px;border-radius:16px}
  .hero h1{font-size:26px;margin-bottom:10px}
  .hero p.lead{font-size:14.5px}
  .grid{grid-template-columns:1fr;gap:14px;padding-left:20px;padding-right:20px}
  .nav button{padding:7px 10px;font-size:13px}
  .card h3{font-size:20px}
  .count{padding:0}
  .dtitle h1{font-size:26px}
  .ddesc{font-size:14.5px}
  .dcard{padding:20px 18px 18px;border-radius:15px;margin-bottom:24px}
  .dback{padding:7px 12px;font-size:13px}
  .gal-nav{width:36px;height:36px;font-size:18px}
}

/* 返回顶部：固定在右下角，滚动到一定距离后才出现 */
.totop{
  position:fixed;right:22px;bottom:26px;z-index:60;
  display:inline-flex;align-items:center;gap:6px;
  padding:9px 15px;border:1px solid rgba(255,255,255,.85);border-radius:22px;
  background:rgba(251,250,247,.82);color:#2C2C2A;
  font-size:13px;letter-spacing:.02em;
  -webkit-backdrop-filter:blur(12px) saturate(1.3);
  backdrop-filter:blur(12px) saturate(1.3);
  box-shadow:0 8px 22px -10px rgba(16,72,102,.55),inset 0 1px 0 rgba(255,255,255,.9);
  opacity:0;visibility:hidden;transform:translateY(10px);
  transition:opacity .26s ease,transform .26s cubic-bezier(.2,.7,.3,1),visibility 0s .26s,background .18s ease,box-shadow .2s ease;
}
.totop.show{opacity:1;visibility:visible;transform:none;transition:opacity .26s ease,transform .26s cubic-bezier(.2,.7,.3,1),visibility 0s 0s,background .18s ease,box-shadow .2s ease}
.totop svg{width:15px;height:15px;color:#993C1D;transition:transform .22s cubic-bezier(.2,.7,.3,1)}
.totop:hover{background:rgba(255,255,255,.96);box-shadow:0 10px 26px -10px rgba(153,60,29,.45),inset 0 1px 0 rgba(255,255,255,1)}
.totop:hover svg{transform:translateY(-2px)}
.totop:active{transform:translateY(0) scale(.97)}
@media (prefers-reduced-motion:reduce){.totop,.totop svg{transition:none}}
@media (max-width:640px){.totop{right:14px;bottom:16px;padding:8px 13px;font-size:12.5px}}
</style>

<body>
<div id="vue-app">

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <span class="brand-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21a1 1 0 0 0 1-1v-5.35c0-.46.32-.85.73-1.04a4 4 0 0 0-2.14-7.59 5 5 0 0 0-9.18 0 4 4 0 0 0-2.14 7.59c.41.19.73.58.73 1.04V20a1 1 0 0 0 1 1Z"/><path d="M6 17h12"/><path d="M9.5 12.5a2.5 2.5 0 0 0 5 0"/></svg></span>
      <span class="glow">百味人生</span>
    </div>
    <nav class="nav">
      <button v-for="v in views" :key="v.k" :class="{on: view===v.k}" @click="view=v.k">{{v.t}}</button>
    </nav>
  </div>
</header>

<section class="hero">
  <div class="wrap">

    pair: ['白米饭（酸辣开胃，特别下饭）', '清炒时蔬 / 拍黄瓜', '温水或淡茶，不必配饮料']
  }
];

window.__STORE__ = {
  all: RECIPES,
  visible: RECIPES.slice(),
  expanded: {},
  detail: null,
  set(list) {
    this.visible = list;
    window.dispatchEvent(new CustomEvent('recipes:render', { detail: list }));
  },
  toggle(id) {
    this.expanded[id] = !this.expanded[id];
    window.dispatchEvent(new Event('recipes:toggle'));
  },
  open(id) {
    this.detail = this.all.find(r => r.id === id) || null;
    window.dispatchEvent(new Event('recipes:detail'));
  },
  close() {
    this.detail = null;
    window.dispatchEvent(new Event('recipes:detail'));
  }
};

/* 返回顶部按钮：滚动超过阈值才显示，点击平滑回到顶部 */
(function () {
  var btn = document.getElementById('toTop');
  if (!btn) return;
  var THRESHOLD = 400;
  var ticking = false;

  function sync() {
    var y = window.pageYOffset || document.documentElement.scrollTop || 0;
    btn.classList.toggle('show', y > THRESHOLD);
    ticking = false;
  }

  window.addEventListener('scroll', function () {
    if (!ticking) {
      ticking = true;
      window.requestAnimationFrame(sync);
    }
  }, { passive: true });

  btn.addEventListener('click', function () {
    var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' });
  });

  sync();
})();
</script>

<script type="text/babel" data-presets="react">
const I = {
  clock: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>,
  users: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
  flame: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22c4.4 0 7-2.8 7-6.5 0-3.5-2.6-5.9-3.8-8.2C14 5 12.5 3 12.5 1c-2.9 1.9-4.2 4.6-4.4 6.8-.2 2.6-1.1 3.7-2.4 4.9C4.3 14 3.6 15.3 3.6 17 3.6 19.7 7.6 22 12 22z"/></svg>,
  arrow: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>,
  pot: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 12h20v3a7 7 0 0 1-7 7H9a7 7 0 0 1-7-7v-3z"/><path d="M8 8V4M12 8V3M16 8V4"/></svg>,
  listol: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M10 6h11"/><path d="M10 12h11"/><path d="M10 18h11"/><path d="M4 6h1v4"/><path d="M4 10h2"/><path d="M6 18H4c0-1 2-1.6 2-2.6S5 14 4 14.5"/></svg>,
  bulb: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M15.1 14c.2-1 .6-1.7 1.4-2.5A4.6 4.6 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.8.8 1.2 1.5 1.4 2.5"/></svg>,
  help: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>,
  swap: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 3l4 4-4 4"/><path d="M21 7H8"/><path d="m7 21-4-4 4-4"/><path d="M3 17h13"/></svg>,
  bowl: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 11h18a9 9 0 0 1-18 0z"/><path d="M9 11V7M15 11V7M12 11V4"/></svg>,
  chef: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21a1 1 0 0 0 1-1v-5.35c0-.46.32-.85.73-1.04a4 4 0 0 0-2.14-7.59 5 5 0 0 0-9.18 0 4 4 0 0 0-2.14 7.59c.41.19.73.58.73 1.04V20a1 1 0 0 0 1 1Z"/><path d="M6 17h12"/></svg>,
  search: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/><path d="M8 11h6"/></svg>,
  back: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 12H5"/><path d="m11 18-6-6 6-6"/></svg>,
  camera: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"><path d="M4 7h3l2-2.5h6L17 7h3a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.2" r="3.6"/></svg>,
  chevron: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m6 9 6 6 6-6"/></svg>
};

/* ---------- 图片画廊 ---------- */
function Gallery({ images, title }) {
  const has = images && images.length;
  if (!has) {
    return (
      <div className="gal-empty">
        <span className="gal-empty-ic">{I.camera}</span>
        <p>这道菜的实拍图还在路上</p>
        <small>图片就绪后会放在这里</small>
      </div>
    );
  }
  if (images.length === 1) {
    return (
      <div className="gal">
        <img className="gal-img" src={images[0].src} alt={images[0].alt || title} />
      </div>
    );
  }
  return <Carousel images={images} title={title} />;
}

function Carousel({ images, title }) {
  const [i, setI] = React.useState(0);
  const go = d => setI((i + d + images.length) % images.length);
  return (
    <div className="gal">
      <img className="gal-img" src={images[i].src} alt={images[i].alt || title} />
      <button className="gal-nav prev" aria-label="上一张" onClick={() => go(-1)}>&#8249;</button>
      <button className="gal-nav next" aria-label="下一张" onClick={() => go(1)}>&#8250;</button>
      <div className="gal-dots">
        {images.map((_, n) => (
          <button key={n} className={'gal-dot' + (n === i ? ' on' : '')} aria-label={'第 ' + (n + 1) + ' 张'} onClick={() => setI(n)} />
        ))}
      </div>
    </div>
  );
}

function Stars({ n }) {
  return (
    <span className="diff">
      {Array.from({ length: n }).map((_, i) => '★').join('')}
      <span className="off">{Array.from({ length: 3 - n }).map((_, i) => '★').join('')}</span>
    </span>
  );
}

/* 折叠区块：点标题栏展开/收起（button 保证键盘可达，hidden 保留面板以维持 aria-controls 有效） */
function Collapse({ title, icon, children }) {
  const [open, setOpen] = React.useState(true);
  const id = 'sec-' + title;
  return (
    <section className={'collapse' + (open ? ' on' : '')}>
      <h4 className="collapse-t">
        <button
          type="button"
          className="collapse-h"
          id={id + '-btn'}
          aria-expanded={open}
          aria-controls={id}
          onClick={() => setOpen(o => !o)}
        >
          <span className="ico" aria-hidden="true">{icon}</span>
          <span className="collapse-label">{title}</span>
          <span className="chev" aria-hidden="true">{I.chevron}</span>
        </button>
      </h4>
      {/* key 随 open 变化 → 展开时面板重新挂载，unfold 动画得以重播 */}
      <div
        key={open ? 'open' : 'closed'}
        className="collapse-body"
        id={id}
        role="region"
        aria-labelledby={id + '-btn'}
        hidden={!open}
      >
        {children}
      </div>
    </section>
  );
}

/* 食材分组：小标题可折叠，展开时下拉淡出 */
function IngBlock({ title, rows }) {
  const [open, setOpen] = React.useState(true);
  const id = 'ing-' + title;
  return (
    <section className={'inggroup ingsub' + (open ? ' on' : '')}>
      <h5 className="ingsub-t">
        <button
          type="button"
          className="ingsub-h"
          id={id + '-btn'}
          aria-expanded={open}
          aria-controls={id}
          onClick={() => setOpen(o => !o)}
        >
          <span className="ingsub-name">{title}</span>
          <span className="ingsub-n">{rows.length} 项</span>
          <span className="chev" aria-hidden="true">{I.chevron}</span>
        </button>
      </h5>
      <div className="ingsub-body" id={id} role="region" aria-labelledby={id + '-btn'}>
        <div className="ingsub-in">
          <div className="ingsub-pad">
            <table className="ingtable">
              <tbody>
                {rows.map((x, i) => (
                  <tr key={i}>
                    <th>
                      {x[0]}
                      {x[2] ? <span className="note">{x[2]}</span> : null}
                    </th>
                    <td>{x[1]}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  );
}

/* 列表卡片：整卡可点，进入详情页 */
function Card({ r, onOpen }) {
  return (
    <article className="card" onClick={() => onOpen(r.id)}>
      <div className="card-top">
        <span className="card-idx">No. <b>{r.no}</b></span>
        <Stars n={r.diff} />
      </div>
      <div className="card-no"><span>{r.cuisine}</span><span>{r.taste}</span></div>
      <h3>{r.title}</h3>
      <p className="desc">{r.desc}</p>
      <div className="meta">
        <i>{I.clock}{r.time}</i>
        <i>{I.users}{r.serve}</i>
        <i>{I.flame}{r.diff === 1 ? '入门' : r.diff === 2 ? '家常' : '进阶'}</i>
      </div>
      <div className="foot">
        <div>{r.tags.map(t => <span className="tag" key={t}>{t}</span>)}</div>
        <span className="open">查看详情 {I.arrow}</span>
      </div>
    </article>
  );
}

/* 菜谱正文：详情页做法详解区块复用 */
function RecipeBody({ r }) {
  return (
    <div className="detail">
      <Collapse title="食材清单" icon={I.pot}>
        {/* 食材分组按菜品自适应：没有该组食材就不渲染（避免出现「0 项」空按钮） */}
        {r.ingredients.main && r.ingredients.main.length > 0 ? <IngBlock title="主料" rows={r.ingredients.main} /> : null}
        {r.ingredients.marinade && r.ingredients.marinade.length > 0 ? <IngBlock title="腌料" rows={r.ingredients.marinade} /> : null}
        {r.ingredients.sauce && r.ingredients.sauce.length > 0 ? <IngBlock title="炒制调料" rows={r.ingredients.sauce} /> : null}
      </Collapse>

      <Collapse title="制作步骤" icon={I.listol}>
        <ol className="steps">
          {r.steps.map((s, i) => (
            <li key={i}>
              <div className="stephead">
                <b>{s.t}</b>
                <span>{s.time}</span>
              </div>
              <ul>{s.list.map((x, j) => <li key={j}>{x}</li>)}</ul>
            </li>
          ))}
        </ol>
      </Collapse>

      <Collapse title="关键要点" icon={I.bulb}>
        <ul>{r.keyPoints.map((k, i) => <li key={i}><strong>{k[0]}</strong> — {k[1]}</li>)}</ul>
      </Collapse>

      <Collapse title="常见问题" icon={I.help}>
        <div className="tablewrap">
          <table>
            <tbody>{r.problems.map((p, i) => <tr key={i}><th>{p[0]}</th><td>{p[1]}</td><td>{p[2]}</td></tr>)}</tbody>
          </table>
        </div>
      </Collapse>

      <Collapse title="变体做法" icon={I.swap}>
        <ul>{r.variants.map((v, i) => <li key={i}><strong>{v[0]}</strong> — {v[1]}</li>)}</ul>
      </Collapse>

      <Collapse title="配餐建议" icon={I.bowl}>
        <ul>{r.pair.map((p, i) => <li key={i}>{p}</li>)}</ul>
      </Collapse>

      <p className="tip"><strong>一句话总结：</strong>{r.summary}</p>
    </div>
  );
}

/* 详情页 */
function Detail({ r, onBack }) {
  return (
    <div className="dpage">
      <div className="dhead">
        <button className="dback" onClick={onBack}>{I.back} 返回列表</button>
        <span className="dcrumb">{r.cuisine} · {r.taste}</span>
      </div>

      {/* 头部信息卡片：悬浮时闪动 */}
      <div className="dcard">
        <div className="dtitle">
          <span className="dno">{r.no}</span>
          <h1>{r.title}</h1>
          <Stars n={r.diff} />
        </div>
        <p className="ddesc">{r.desc}</p>
        <div className="meta dmeta">
          <i>{I.clock}{r.time}</i>
          <i>{I.users}{r.serve}</i>
          <i>{I.flame}{r.diff === 1 ? '入门' : r.diff === 2 ? '家常' : '进阶'}</i>
        </div>
        <div className="dtags">{r.tags.map(t => <span className="tag" key={t}>{t}</span>)}</div>
      </div>

      <section className="dsec">
        <h3 className="dsec-t">成品图</h3>
        <div className="dsec-body">
          <Gallery images={r.images} title={r.title} />
        </div>
      </section>

      <section className="dsec">
        <h3 className="dsec-t">做法详解</h3>
        <div className="dsec-body">
          <RecipeBody r={r} />
        </div>
      </section>
    </div>
  );
}

function Empty({ onReset }) {
  return (
    <div className="empty">
      {I.search}
      <p>没有找到匹配的菜谱</p>
      <button onClick={onReset}>清空搜索条件</button>
    </div>
  );
}

function App({ list, onReset }) {
  const d = window.__STORE__.detail;
  if (d) return <Detail r={d} onBack={() => window.__STORE__.close()} />;
  if (!list.length) return <Empty onReset={onReset} />;
  return (
    <div className="grid">
      {list.map(r => (
        <Card key={r.id} r={r} onOpen={id => window.__STORE__.open(id)} />
      ))}
    </div>
  );
}

const rootEl = document.getElementById('list');
const root = ReactDOM.createRoot(rootEl);

function render() {
  root.render(
    <App
      list={window.__STORE__.visible}
      onReset={() => window.dispatchEvent(new Event('recipes:reset'))}
    />
  );
}

window.__renderList = render;
window.addEventListener('recipes:render', render);
window.addEventListener('recipes:detail', render);
window.addEventListener('recipes:toggle', render);
render();
</script>

<script>
const { createApp } = Vue;

createApp({
  data() {
    return {
      q: '',
      diff: '',
      view: 'recipes',
      views: [
        { k: 'recipes', t: '菜谱卡片' }
      ]
    };
  },
  computed: {
    filtered() {
      const q = this.q.trim().toLowerCase();
      const words = q.split(/\s+/).filter(Boolean);
      return window.__STORE__.all.filter(r => {
        if (this.diff && String(r.diff) !== this.diff) return false;
        if (!words.length) return true;
        const hay = this.haystack(r);
        return words.every(w => hay.includes(w));
      });
    },
    countHtml() {
      const total = window.__STORE__.all.length;
      const n = this.filtered.length;
      const active = this.q.trim() || this.diff;
      return active ? '匹配 <b>' + n + '</b> / ' + total + ' 道' : '共收录 <b>' + total + '</b> 道';
    }
  },
  watch: {
    filtered: {
      immediate: true,
      handler(list) {
        window.__STORE__.set(list);
      }
    }
  },
  methods: {
    haystack(r) {
      // 食材分组按菜品自适应（有的菜没有腌料组），先摊平再拼
      const ing = []
        .concat(r.ingredients.main || [])
        .concat(r.ingredients.marinade || [])
        .concat(r.ingredients.sauce || [])
        .flat();
      return [
        r.title, r.cuisine, r.taste, r.desc, r.no, r.time, r.serve, r.summary,
        ...r.tags,
        ...ing,
        ...r.steps.map(s => s.t + s.time + s.list.join('')),
        ...r.keyPoints.flat(),
        ...r.problems.flat(),
        ...r.variants.flat(),
        ...r.pair
      ].join(' ').toLowerCase();
    },
    setDiff(d) { this.diff = d; },
    clearAll() { this.q = ''; this.diff = ''; }
  },
  mounted() {
    const input = document.getElementById('searchInput');
    document.addEventListener('keydown', e => {
      if (e.key === '/' && document.activeElement !== input) {
        e.preventDefault();
        input.focus();
        input.select();
      }
    });
    window.addEventListener('recipes:reset', () => this.clearAll());
  }
}).mount('#vue-app');
</script>
</body>
