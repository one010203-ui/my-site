  box-shadow: 0 1px 4px rgba(0,0,0,0.03);
}
.content-body hr {
  border: none;
  border-top: 1px solid var(--border);
  margin: 24px 0;
}
/* Nav buttons */
.lesson-nav {
  display: flex;
  justify-content: space-between;
  margin-top: 32px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}
.nav-btn {
  padding: 10px 20px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg-card);
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 13px;
  transition: all 0.2s;
  text-decoration: none;
}
.nav-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: linear-gradient(135deg, var(--accent-light), var(--accent-medium));
  transform: translateY(-1px);
  box-shadow: 0 4px 12px var(--accent-light);
}
.nav-btn.disabled {
  opacity: 0.4;
  pointer-events: none;
}
/* Search */
.search-box {
  position: sticky;
  top: 0;
  z-index: 60;
  padding: 20px 0 16px;
  display: flex;
  justify-content: center;
  background: linear-gradient(180deg, var(--bg) 60%, transparent);
}
.search-label {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 16px;
  font-size: 13px;
  font-weight: 600;
  color: var(--accent);
  background: var(--accent-light);
  border: 1px solid var(--border);
  border-right: none;
  border-radius: 14px 0 0 14px;
  white-space: nowrap;
  user-select: none;
}
.search-icon {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
}
.search-input {
  flex: 1;
  max-width: 480px;
  padding: 14px 20px;
  border: 1px solid var(--border);
  border-left: none;
  border-radius: 0 14px 14px 0;
  font-size: 14px;
  background: var(--bg-card);
  color: var(--text);
  outline: none;
  transition: all 0.25s;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06),  0 0 0 0 var(--accent-light);
}
.search-input:focus {
  border-color: var(--accent);
  box-shadow: 0 4px 20px var(--accent-light), 0 0 0 4px var(--accent-light);
  transform: translateY(-1px);
}
.search-input::placeholder { color: var(--text-secondary); }
/* Mobile menu toggle button */
.mobile-menu-btn {
  display: none;
  position: fixed;
  top: 12px;
  left: 12px;
  z-index: 90;
  width: 40px;
  height: 40px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--bg-card);
  color: var(--accent);
  font-size: 18px;
  cursor: pointer;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  transition: all 0.2s;
}
.mobile-menu-btn:active { transform: scale(0.95); }

/* Overlay for mobile sidebar */
.sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 55;
  opacity: 0;
  transition: opacity 0.3s;
}
.sidebar-overlay.active {
  opacity: 1;
}

/* Responsive */
@media (max-width: 768px) {
  .app-container { --sidebar-w: 0px; }
  .mobile-menu-btn { display: flex; }

  .sidebar {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    z-index: 60;
    width: 280px;
    min-width: 280px;
    transform: translateX(-100%);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 4px 0 24px rgba(0,0,0,0.12);
    display: block;
  }
  .sidebar.mobile-open {
    transform: translateX(0);
  }
  .sidebar-overlay {
    display: block;
    pointer-events: none;
  }
  .sidebar-overlay.active {
    pointer-events: auto;
  }

  .app-container::before { display: none; }
  .app-container::after { display: none; }

  .main-content {
    padding: 60px 12px 24px;
    max-width: 100%;
  }
  .content-card { padding: 20px 16px; border-radius: 12px; }
  .theme-switch { top: 12px; right: 12px; }
  .theme-trigger { padding: 6px 10px 6px 8px; gap: 6px; }
  .theme-trigger-name { font-size: 12px; }
  .theme-menu {
    min-width: 180px;
    right: -10px;
  }

  /* Search box full width */
  .search-box {
    padding: 8px 0 12px;
  }
  .search-label {
    padding: 0 10px;
    font-size: 12px;
  }
  .search-input {
    padding: 10px 14px;
    font-size: 13px;
  }

  /* Content adjustments */
  .lesson-title { font-size: 20px; }
  .lesson-meta { font-size: 12px; }
  .content-body h1 { font-size: 18px; }
  .content-body h2 { font-size: 16px; }
  .content-body h3 { font-size: 14px; }
  .content-body p,
  .content-body ul,
  .content-body ol { font-size: 13px; }

  /* Table scroll wrapper */
  .content-body table {
    display: block;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    font-size: 12px;
    white-space: nowrap;
  }
  .content-body th,
  .content-body td {
    padding: 8px 10px;
    min-width: 80px;
  }

  /* Code block scroll */
  .content-body pre {
    padding: 12px 14px;
    font-size: 12px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    white-space: pre;
    word-wrap: normal;
  }
  .content-body pre code {
    font-size: 12px;
    white-space: pre;
  }

  /* Keyword overflow */
  .content-body .kw {
    font-size: 0.88em;
    word-break: break-all;
  }

  /* Blockquote */
  .content-body blockquote {
    padding: 10px 12px;
    font-size: 12px;
  }

  /* Nav buttons */
  .lesson-nav {
    flex-direction: column;
    gap: 8px;
  }
  .nav-btn {
    text-align: center;
    padding: 10px 16px;
  }
}

/* Very small screens */
@media (max-width: 380px) {
  .content-card { padding: 16px 12px; }
  .lesson-title { font-size: 18px; }
}

<li>示例：<code>price <span class="kw">decimal</span>(12,2)</code>，存储金额。</li>
</ul>
<blockquote>严禁用FLOAT/DOUBLE存钱，会出现0.1+0.2!=0.3精度问题。</blockquote>

<h2>2. 字符串类型</h2>
<table>
<tr><th>类型</th><th>最大长度</th><th>特点</th><th>使用场景</th></tr>
<tr><td>char(n)</td><td>255字符</td><td>定长，不足自动补空格；查询快，浪费空间</td><td>固定短文本：手机号、身份证、编码</td></tr>
<tr><td>varchar(n)</td><td>65535字节</td><td>变长，只占用实际字符+1~2字节长度标识</td><td><strong>最常用</strong>，用户名、标题、地址</td></tr>
<tr><td>tinytext</td><td>255字符</td><td>大文本</td><td>简短备注</td></tr>
<tr><td>text</td><td>65535字符</td><td>大文本，不能有默认值</td><td>文章内容、长备注</td></tr>
<tr><td>mediumtext</td><td>16777215字符</td><td>更长文本</td><td>长文章</td></tr>
<tr><td>longtext</td><td>4294967295字符</td><td>超大文本</td><td>巨量文本，极少用</td></tr>
</table>
<blockquote>
<p>重要规则：</p>
<ol>
<li>varchar 限制是<strong>字节</strong>不是字符，utf8mb4 一个汉字占4字节。<code><span class="kw">varchar</span>(100)</code> 代表100个字符。</li>
<li>char 适合固定长度，VARCHAR适合长短不一字符串。</li>
<li>TEXT系列<strong>不能直接建普通索引</strong>，需要前缀索引。</li>
<li>字符集推荐：<code>utf8mb4</code>，支持emoji表情；旧<code>utf8</code>只支持3字节，已废弃。</li>
</ol>
</blockquote>

<h2>3. 日期时间类型</h2>
<table>
<tr><th>类型</th><th>字节</th><th>范围</th><th>特点</th></tr>
<tr><td>date</td><td>3</td><td>1000-01-01 ~ 9999-12-31</td><td>只存日期，YYYY-MM-DD</td></tr>
<tr><td>time</td><td>3</td><td>-838:59:59 ~ 838:59:59</td><td>时分秒，支持负数，时间段</td></tr>
<tr><td>datetime</td><td>8</td><td>1000-01-01 ~ 9999-12-31</td><td>日期+时间，<strong>不受时区影响</strong>，推荐业务使用</td></tr>
<tr><td>timestamp</td><td>4</td><td>1970-01-01 ~ 2038-01-19</td><td>时间戳，受时区影响，上限2038年，<strong>不推荐做主业务时间</strong></td></tr>
<tr><td>year</td><td>1</td><td>1901~2155</td><td>年份，很少用</td></tr>
</table>
<pre><code><span class="kw">create</span> <span class="kw">table</span> demo(

    title: '约束 - 概述',
    content: `
<p><strong>概念：</strong>约束作用于表中字段上的规则，用于限制存储在表中的数据。</p>
<p><strong>目的：</strong>保证数据库中数据的正确、有效性和完整性。</p>

<h2>分类</h2>
<table>
<tr><th>约束</th><th>描述</th><th>关键字</th></tr>
<tr><td>非空约束</td><td>限制该字段的数据不能为NULL</td><td>not null</td></tr>
<tr><td>唯一约束</td><td>保证该字段的所有数据都是唯一、不重复的</td><td>unique</td></tr>
<tr><td>主键约束</td><td>主键是一行数据的唯一标识，要求非空且唯一</td><td>primary key</td></tr>
<tr><td>默认约束</td><td>保存数据时，如果未指定该字段的值，则采用默认值</td><td>default</td></tr>
<tr><td>检查约束(8.0.16版本之后)</td><td>保证字段值满足某一个条件</td><td>check</td></tr>
<tr><td>外键约束</td><td>用来让两张表的数据之间建立连接，保证数据的一致性和完整性</td><td>foreign key</td></tr>
</table>

<blockquote>注意：约束是作用于表中字段上的，可以在创建表/修改表的时候添加约束。</blockquote>`

<h2>删除外键</h2>
<pre><code><span class="kw">alter</span> <span class="kw">table</span> 表名 <span class="kw">drop</span> <span class="kw">foreign</span> <span class="kw">key</span> 外键名称;</code></pre>`

    content: `
<h2>删除/更新行为</h2>
<table>
<tr><th>行为</th><th>说明</th></tr>
<tr><td>no action</td><td>当在父表中删除/更新对应记录时，首先检查该记录是否有对应外键，如果有则不允许删除/更新（与RESTRICT一致）</td></tr>
<tr><td>restrict</td><td>当在父表中删除/更新对应记录时，首先检查该记录是否有对应外键，如果有则不允许删除/更新（与NO ACTION一致）</td></tr>
<tr><td>cascade</td><td>当在父表中删除/更新对应记录时，首先检查该记录是否有对应外键，如果有，则也删除/更新外键在子表中的记录</td></tr>

<tr><td>set default</td><td>父表有变更时，子表将外键列设置成一个默认的值（InnoDB不支持）</td></tr>
</table>

<h2>sql 语法</h2>
<pre><code><span class="kw">alter</span> <span class="kw">table</span> 表名

<span class="kw">on</span> <span class="kw">update</span> <span class="kw">cascade</span>

    id: 24, category: '多表关系', shortTitle: '多表关系-概述',
    title: '多表关系 - 概述',
    content: `
<h2>一、概述</h2>
<p>在关系型数据库中，表与表之间存在三种基本关系：</p>
<table>
<tr><th>关系类型</th><th>说明</th><th>示例</th></tr>
<tr><td>一对一</td><td>A表一条记录对应B表一条记录</td><td>用户 ↔ 用户详情</td></tr>
<tr><td>一对多</td><td>A表一条记录对应B表多条记录</td><td>部门 ↔ 员工</td></tr>
<tr><td>多对多</td><td>A表一条记录对应B表多条，反之亦然</td><td>学生 ↔ 课程</td></tr>
</table>

<h2>二、一对一关系（one-to-one）</h2>
<h3>场景</h3>
<ul>
<li>用户表 与 用户详情表</li>
<li>拆分常用字段和不常用字段，减少主表体积</li>
</ul>
<h3>实现方式</h3>
<p><strong>方式1：共享主键</strong></p>
<pre><code>-- 用户表
<span class="kw">create</span> <span class="kw">table</span> <span class="kw">users</span> (
  user_id <span class="kw">int</span> <span class="kw">primary</span> <span class="kw">key</span> <span class="kw">auto_increment</span>,
  username <span class="kw">varchar</span>(50) <span class="kw">not</span> <span class="kw">null</span>,
  <span class="kw">password</span> <span class="kw">varchar</span>(255) <span class="kw">not</span> <span class="kw">null</span>
);

-- 用户详情表（user_id 既是主键也是外键）
<span class="kw">create</span> <span class="kw">table</span> user_profiles (
  user_id <span class="kw">int</span> <span class="kw">primary</span> <span class="kw">key</span>,
  real_name <span class="kw">varchar</span>(50),
  id_card <span class="kw">varchar</span>(18),
  address <span class="kw">varchar</span>(200),
  <span class="kw">foreign</span> <span class="kw">key</span> (user_id) <span class="kw">references</span> <span class="kw">users</span>(user_id)
);</code></pre>

<p><strong>方式2：外键 + 唯一约束</strong></p>
<pre><code><span class="kw">create</span> <span class="kw">table</span> user_profiles (
  profile_id <span class="kw">int</span> <span class="kw">primary</span> <span class="kw">key</span> <span class="kw">auto_increment</span>,
  user_id <span class="kw">int</span> <span class="kw">unique</span>,          -- <span class="kw">unique</span> 保证一对一
  real_name <span class="kw">varchar</span>(50),
  avatar <span class="kw">varchar</span>(255),
  <span class="kw">foreign</span> <span class="kw">key</span> (user_id) <span class="kw">references</span> <span class="kw">users</span>(user_id)
);</code></pre>

<h2>三、一对多关系（one-to-Many）</h2>
<h3>场景</h3>
<ul>
<li>一个部门有多个员工</li>
<li>一个用户有多篇文章</li>
<li>一个订单有多个商品</li>
</ul>
<h3>实现方式</h3>
<p>在"多"的一方添加外键，指向"一"的一方。</p>
<pre><code>-- 部门表（一方）
<span class="kw">create</span> <span class="kw">table</span> departments (
  dept_id <span class="kw">int</span> <span class="kw">primary</span> <span class="kw">key</span> <span class="kw">auto_increment</span>,
  dept_name <span class="kw">varchar</span>(50) <span class="kw">not</span> <span class="kw">null</span>
);

-- 员工表（多方）
<span class="kw">create</span> <span class="kw">table</span> employees (
  emp_id <span class="kw">int</span> <span class="kw">primary</span> <span class="kw">key</span> <span class="kw">auto_increment</span>,
  emp_name <span class="kw">varchar</span>(50) <span class="kw">not</span> <span class="kw">null</span>,
  dept_id <span class="kw">int</span>,
  salary <span class="kw">decimal</span>(10,2),
  <span class="kw">foreign</span> <span class="kw">key</span> (dept_id) <span class="kw">references</span> departments(dept_id)
);</code></pre>

<h3>常见操作</h3>
<pre><code>-- 查询某部门下所有员工
<span class="kw">select</span> e.emp_name, e.salary
<span class="kw">from</span> employees e
<span class="kw">join</span> departments d <span class="kw">on</span> e.dept_id = d.dept_id
<span class="kw">where</span> d.dept_name = '技术部';

-- 查询每个部门的员工数量
<span class="kw">select</span> d.dept_name, <span class="kw">count</span>(e.emp_id) <span class="kw">as</span> emp_count
<span class="kw">from</span> departments d
<span class="kw">left</span> <span class="kw">join</span> employees e <span class="kw">on</span> d.dept_id = e.dept_id
<span class="kw">group</span> <span class="kw">by</span> d.dept_name;</code></pre>

<h2>四、多对多关系（Many-to-Many）</h2>
<h3>场景</h3>
<ul>
<li>一个学生选多门课，一门课有多个学生</li>
<li>一个订单包含多个商品，一个商品属于多个订单</li>
<li>一个用户有多个角色，一个角色分配给多个用户</li>
</ul>
<h3>实现方式</h3>
<p>需要借助<strong>中间表（关联表）</strong>，将多对多拆分为两个一对多。</p>
<pre><code>-- 学生表
<span class="kw">create</span> <span class="kw">table</span> students (
  student_id <span class="kw">int</span> <span class="kw">primary</span> <span class="kw">key</span> <span class="kw">auto_increment</span>,
  student_name <span class="kw">varchar</span>(50) <span class="kw">not</span> <span class="kw">null</span>
);

-- 课程表
<span class="kw">create</span> <span class="kw">table</span> courses (
  course_id <span class="kw">int</span> <span class="kw">primary</span> <span class="kw">key</span> <span class="kw">auto_increment</span>,
  course_name <span class="kw">varchar</span>(100) <span class="kw">not</span> <span class="kw">null</span>,
  credit <span class="kw">int</span>
);

-- 中间表：学生-课程关联
<span class="kw">create</span> <span class="kw">table</span> student_courses (
  id <span class="kw">int</span> <span class="kw">primary</span> <span class="kw">key</span> <span class="kw">auto_increment</span>,
  student_id <span class="kw">int</span> <span class="kw">not</span> <span class="kw">null</span>,
  course_id <span class="kw">int</span> <span class="kw">not</span> <span class="kw">null</span>,
  score <span class="kw">decimal</span>(5,2),
  <span class="kw">foreign</span> <span class="kw">key</span> (student_id) <span class="kw">references</span> students(student_id),
  <span class="kw">foreign</span> <span class="kw">key</span> (course_id) <span class="kw">references</span> courses(course_id),
  <span class="kw">unique</span> <span class="kw">key</span> uk_student_course (student_id, course_id)
);</code></pre>

<h3>常见操作</h3>
<pre><code>-- 查询某个学生选了哪些课
<span class="kw">select</span> s.student_name, c.course_name, sc.score
<span class="kw">from</span> student_courses sc
<span class="kw">join</span> students s <span class="kw">on</span> sc.student_id = s.student_id
<span class="kw">join</span> courses c <span class="kw">on</span> sc.course_id = c.course_id
<span class="kw">where</span> s.student_name = '张三';

-- 查询每门课的选课人数
<span class="kw">select</span> c.course_name, <span class="kw">count</span>(sc.student_id) <span class="kw">as</span> student_count
<span class="kw">from</span> courses c
<span class="kw">left</span> <span class="kw">join</span> student_courses sc <span class="kw">on</span> c.course_id = sc.course_id
<span class="kw">group</span> <span class="kw">by</span> c.course_name;</code></pre>

<h2>五、多表联查（join）</h2>
<h3>5.1 inner join（内连接）</h3>
<p>只返回两表中匹配的行。</p>
<pre><code><span class="kw">select</span> orders.order_id, <span class="kw">users</span>.username, orders.total_amount
<span class="kw">from</span> orders
<span class="kw">inner</span> <span class="kw">join</span> <span class="kw">users</span> <span class="kw">on</span> orders.user_id = <span class="kw">users</span>.user_id;</code></pre>

<h3>5.2 left join（左连接）</h3>
<p>返回左表所有行，右表无匹配则填 null。</p>
<pre><code><span class="kw">select</span> <span class="kw">users</span>.username, orders.order_id, orders.total_amount
<span class="kw">from</span> <span class="kw">users</span>
<span class="kw">left</span> <span class="kw">join</span> orders <span class="kw">on</span> <span class="kw">users</span>.user_id = orders.user_id;</code></pre>

<h3>5.3 right join（右连接）</h3>
<p>返回右表所有行，左表无匹配则填 null。</p>
<pre><code><span class="kw">select</span> orders.order_id, <span class="kw">users</span>.username
<span class="kw">from</span> orders
<span class="kw">right</span> <span class="kw">join</span> <span class="kw">users</span> <span class="kw">on</span> orders.user_id = <span class="kw">users</span>.user_id;</code></pre>

<h3>5.4 三表联查</h3>
<pre><code><span class="kw">select</span> 
  o.order_id,
  u.username,
  p.product_name,
  oi.quantity,
  oi.price
<span class="kw">from</span> orders o
<span class="kw">join</span> <span class="kw">users</span> u <span class="kw">on</span> o.user_id = u.user_id
<span class="kw">join</span> order_items oi <span class="kw">on</span> o.order_id = oi.order_id
<span class="kw">join</span> products p <span class="kw">on</span> oi.product_id = p.product_id
<span class="kw">where</span> o.order_id = 1001;</code></pre>

<h2>六、外键约束</h2>
<h3>6.1 约束行为</h3>
<table>
<tr><th>约束行为</th><th>说明</th></tr>
<tr><td>restrict / no action</td><td>禁止删除/更新被引用的父记录</td></tr>
<tr><td>cascade</td><td>父表删除/更新，子表同步删除/更新</td></tr>
<tr><td>set null</td><td>父表删除/更新，子表外键设为 null</td></tr>
<tr><td>set default</td><td>设为默认值（innodb 不支持）</td></tr>
</table>

<h3>6.2 示例</h3>
<pre><code><span class="kw">create</span> <span class="kw">table</span> orders (
  order_id <span class="kw">int</span> <span class="kw">primary</span> <span class="kw">key</span> <span class="kw">auto_increment</span>,
  user_id <span class="kw">int</span>,
  total_amount <span class="kw">decimal</span>(10,2),
  created_at <span class="kw">timestamp</span> <span class="kw">default</span> <span class="kw">current_timestamp</span>,
  <span class="kw">foreign</span> <span class="kw">key</span> (user_id) <span class="kw">references</span> <span class="kw">users</span>(user_id)
    <span class="kw">on</span> <span class="kw">delete</span> <span class="kw">set</span> <span class="kw">null</span>
    <span class="kw">on</span> <span class="kw">update</span> <span class="kw">cascade</span>
);</code></pre>

<h3>6.3 注意事项</h3>
<ul>
<li>外键列和引用列的<strong>数据类型必须一致</strong></li>
<li>外键列和引用列都需要<strong>建立索引</strong></li>
<li>使用 innodb 引擎才支持外键（myisam 不支持）</li>
<li>高并发场景下，外键会带来性能损耗，部分公司规范禁止外键</li>
</ul>

<h2>七、最佳实践</h2>
<ol>
<li><strong>命名规范</strong>：外键列名 = 引用表名_主键名（如 user_id）</li>
<li><strong>索引</strong>：外键列自动创建索引，无需手动添加</li>
<li><strong>中间表命名</strong>：按字母顺序命名，如 student_courses</li>
<li><strong>中间表可携带额外字段</strong>：如 score、enroll_date</li>
<li><strong>避免循环外键</strong>：A 引用 B，B 引用 C，C 又引用 A</li>
<li><strong>分库分表场景</strong>：不使用外键，由应用层保证一致性</li>
</ol>`

<p>多表查询是指从多张表中查询数据。</p>
<p><strong>笛卡尔积：</strong>笛卡尔积是指数学中，两个集合A集合和B集合的所有组合情况。</p>

<h2>分类</h2>

  </ul>
</li>

</ul>`

  {

    title: '联合查询 - UNION & UNION ALL',
    content: `
<p>对于UNION查询，就是把多次查询的结果合并起来，形成一个新的查询结果集。</p>

<pre><code><span class="kw">select</span> 字段列表 <span class="kw">from</span> 表A ...
<span class="kw">union</span> <span class="kw">all</span>
<span class="kw">select</span> 字段列表 <span class="kw">from</span> 表B ...;</code></pre>

<p>对于联合查询的多张表的列数必须保持一致，字段类型也需要保持一致。</p>

    title: '子查询',
    content: `
<h2>1.1 概念</h2>
<p>SQL语句中嵌套SELECT语句，称为嵌套查询，又称子查询。</p>
<pre><code><span class="kw">select</span> * <span class="kw">from</span> T1 <span class="kw">where</span> column1 = (<span class="kw">select</span> column1 <span class="kw">from</span> T2);
-- 子查询外部的语句可以是INSERT/<span class="kw">update</span>/<span class="kw">delete</span>/SELECT的任何一个</code></pre>

<h2>1.2 根据子查询结果不同，分为</h2>
<ul>
<li><strong>标量子查询</strong>（子查询结果为单个值）</li>
<li><strong>列子查询</strong>（子查询结果为一列）</li>
</ul>

<table>
<tr><th>操作符</th><th>描述</th></tr>
<tr><td>in</td><td>在指定的集合范围之内，多选一</td></tr>
<tr><td>not in</td><td>不在指定的集合范围之内</td></tr>
<tr><td>ANY</td><td>子查询返回列表中，有任意一个满足即可</td></tr>
<tr><td>SOME</td><td>与ANY等同，使用SOME的地方都可以使用ANY</td></tr>
<tr><td>all</td><td>子查询返回列表的所有值都必须满足，等同于IN效果</td></tr>
</table>

<ul>
<li><strong>行子查询</strong>（子查询结果为一行）</li>
</ul>
<pre><code><span class="kw">select</span> * <span class="kw">from</span> T1 <span class="kw">where</span> (age, <span class="kw">name</span>) = (20, 'tom');</code></pre>

<ul>
<li><strong>表子查询</strong>（子查询结果为多行多列）</li>
</ul>

<h2>1.3 根据子查询位置，分为</h2>
<p>WHERE之后、FROM之后、SELECT之后。</p>`

    id: 28, category: '事务', shortTitle: '事务',
    title: '事务',
    content: `
<p>事务是一组操作的集合，它是一个不可分割的工作单位，事务会把所有的操作作为一个整体一起向系统提交或撤销操作请求，要么同时成功，要么同时失败。</p>
<p>默认MySQL的事务是自动提交的，也就是说，当执行一条DML语句，MySQL会立即隐式的提交事务。</p>

<h2>事务操作</h2>
<h3>方式一</h3>
<pre><code>-- 查看/设置事务提交方式
<span class="kw">select</span> @@<span class="kw">autocommit</span>;
-- 提交事务
<span class="kw">commit</span>;
-- 回滚事务
<span class="kw">rollback</span>;</code></pre>

<h3>方式二</h3>
<pre><code>-- 开启事务
<span class="kw">start</span> <span class="kw">transaction</span> 或 <span class="kw">begin</span>;
-- 提交事务
<span class="kw">commit</span>;
-- 回滚事务
<span class="kw">rollback</span>;</code></pre>

<h2>事务的四大特性</h2>
<ul>
<li><strong>原子性（Atomicity）</strong>：事务是不可分割的最小操作单元，要么全部成功，要么全部失败。</li>
<li><strong>一致性（Consistency）</strong>：事务完成时，必须使所有的数据都保持一致状态。</li>
<li><strong>隔离性（isolation）</strong>：数据库系统提供的隔离机制，保证事务在不受外部并发操作影响的独立环境下运行。</li>
<li><strong>持久性（Durability）</strong>：事务一旦提交或回滚，它对数据库中的数据的改变就是永久的。</li>
</ul>

<h2>并发事务问题</h2>
<table>
<tr><th>问题</th><th>描述</th></tr>
<tr><td>脏读</td><td>一个事务读到另一个事务还没有提交的数据</td></tr>
<tr><td>不可重复读</td><td>一个事务先后读取同一条记录，但两次读取的数据不同</td></tr>
<tr><td>幻读</td><td>一个事务按照条件查询数据时，没有对应的数据行，但是在插入数据时，又发现这行数据已经存在</td></tr>
</table>

<h2>事务隔离级别</h2>
<table>
<tr><th>隔离级别</th><th>脏读</th><th>不可重复读</th><th>幻读</th></tr>
<tr><td>read uncommitted</td><td>✓</td><td>✓</td><td>✓</td></tr>
<tr><td>read committed</td><td>✕</td><td>✓</td><td>✓</td></tr>
<tr><td>repeatable read（MySQL默认）</td><td>✕</td><td>✕</td><td>✓</td></tr>
<tr><td>serializable</td><td>✕</td><td>✕</td><td>✕</td></tr>
</table>

<pre><code>-- 查看事务隔离级别
<span class="kw">select</span> @@TRANSACTION_ISOLATION;

-- 设置事务隔离级别
<span class="kw">set</span> [<span class="kw">session</span>|<span class="kw">global</span>] <span class="kw">transaction</span> <span class="kw">isolation</span> <span class="kw">level</span> [隔离级别];</code></pre>

<blockquote>注意：事务隔离级别越高，数据越安全，但是性能越低。</blockquote>`
  }
];

createApp({
  data() {
    return {
      currentId: 1,
      searchQuery: '',
      theme: 'gold',
      themeMenuOpen: false,
      themeList: [
        { key: 'gold', name: '金色' },
        { key: 'pink', name: '粉色' },
        { key: 'cyan', name: '青色' },
        { key: 'green', name: '绿色' },
        { key: 'slate', name: '石板灰' },
        { key: 'deep-teal', name: '深青' },
        { key: 'dark-gold', name: '黑金' },
        { key: 'ink', name: '水墨' }
      ],
      sidebarCollapsed: false,
      expandedGroups: {},
      mobileMenuOpen: false
    };
  },
  computed: {
    themeNames() {
      return this.themeList.reduce((acc, t) => { acc[t.key] = t.name; return acc; }, {});
    },
    currentLesson() {
      return lessons.find(l => l.id === this.currentId) || lessons[0];
    },
    filteredGroups() {
      const q = this.searchQuery.toLowerCase().trim();
      const categoryMap = {};
      lessons.forEach(l => {
        if (!categoryMap[l.category]) categoryMap[l.category] = { category: l.category, items: [] };
        if (!q || l.title.toLowerCase().includes(q) || l.shortTitle.toLowerCase().includes(q)) {
          categoryMap[l.category].items.push(l);
        }
      });
      return Object.values(categoryMap).filter(g => g.items.length > 0);
    }
  },
  methods: {
    setTheme(t) {
      this.theme = t;
      document.documentElement.setAttribute('data-theme', t === 'gold' ? '' : t);
    },
    toggleThemeMenu() {
      this.themeMenuOpen = !this.themeMenuOpen;
    },
    pickTheme(t) {
      this.setTheme(t);
      this.themeMenuOpen = false;
    },
    closeThemeMenu(e) {
      if (e.target && e.target.closest && !e.target.closest('.theme-switch')) {
        this.themeMenuOpen = false;
      }
    },
    toggleGroup(category) {
      this.expandedGroups = { ...this.expandedGroups, [category]: !this.expandedGroups[category] };
    },
    openMobileMenu() {
      this.mobileMenuOpen = true;
      document.body.style.overflow = 'hidden';
    },
    closeMobileMenu() {
      this.mobileMenuOpen = false;
      document.body.style.overflow = '';
    },
    prevLesson() {
      if (this.currentId > 1) this.currentId--;
    },
    nextLesson() {
      if (this.currentId < lessons.length) this.currentId++;
    }
  },
  mounted() {
    document.documentElement.setAttribute('data-theme', '');
    document.addEventListener('click', this.closeThemeMenu);
    // Initialize all groups as expanded by default
    const initialExpanded = {};
    this.filteredGroups.forEach((group) => {
      initialExpanded[group.category] = true;
    });
    this.expandedGroups = initialExpanded;
  },
  beforeUnmount() {
    document.removeEventListener('click', this.closeThemeMenu);
  }
}).mount('#app');
</script>
</body>
</html>
