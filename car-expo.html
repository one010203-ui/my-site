<!DOCTYPE html>
<html data-page-node-id="fxL9B2farP6oQEFRwMC4S3" lang="zh-CN">
<head data-page-node-id="cvFs6EvQrt4h94UjwWh3p8">
    <meta data-page-node-id="NeIqVpbMwBKLEmqI5WzO2U" charset="UTF-8">
    <meta data-page-node-id="QxD1hh8PM2BjiFIrr4rD7k" content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">

    <meta data-page-node-id="7kWX7M5e1X1RWCfErQeiQP" content="汽车博览 —— 打造第一汽车博览站，全站均是中配车型。" name="description">
    <title data-page-node-id="AtJKF80dmBz899xNBOreDN" data-pnid-children="2BohU8sIdnGCdluqCOciam">汽车博览</title>
    <style data-page-node-id="izXo4jFnFH2YCvurbA9j3B" data-pnid-children="5622u8EeYKcx0fBTkfkjBn">
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Noto Serif SC", "Songti SC", serif;
            background: #fdf8f6;
            color: #2c2c2c;
            line-height: 1.8;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }
        /* 页面底板：绿色对比色（暖调胭脂 / 赤陶），绿色作为点缀保留 */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background:
                radial-gradient(circle at 10% 16%, rgba(226, 138, 138, 0.26) 0%, transparent 44%),
                radial-gradient(circle at 90% 10%, rgba(238, 176, 148, 0.28) 0%, transparent 46%),
                radial-gradient(circle at 80% 80%, rgba(216, 120, 122, 0.20) 0%, transparent 48%),
                radial-gradient(circle at 18% 90%, rgba(242, 196, 176, 0.26) 0%, transparent 46%),
                radial-gradient(circle at 50% 50%, rgba(250, 232, 226, 0.5) 0%, transparent 60%),
                linear-gradient(160deg, #fdf9f7 0%, #fbf0ec 48%, #fdf6f2 100%);
        }
        /* ============ 首页 ============ */
        .view { display: none; }
        .view.active { display: block; animation: fadeIn 0.35s ease; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .header {
            text-align: center;
            padding: 70px 20px 46px;
            border-bottom: 1px solid #e8dfd7;
            position: relative;
            overflow: hidden;
        }
        /* 背景流动光晕 */
        .header::before {
            content: "";
            position: absolute;
            top: -60%;
            left: -30%;
            width: 160%;
            height: 220%;
            background:
                radial-gradient(circle at 30% 40%, rgba(26, 71, 42, 0.07) 0%, transparent 45%),
                radial-gradient(circle at 70% 60%, rgba(120, 170, 130, 0.09) 0%, transparent 50%);
            animation: driftBg 18s ease-in-out infinite alternate;
            pointer-events: none;
        }
        @keyframes driftBg {
            0%   { transform: translate3d(0, 0, 0) scale(1); }
            50%  { transform: translate3d(4%, -3%, 0) scale(1.06); }
            100% { transform: translate3d(-4%, 3%, 0) scale(1.02); }
        }
        .header h1 {
            position: relative;
            font-family: "Kaiti SC", "STKaiti", "Noto Serif SC", serif;
            font-size: clamp(2.4rem, 8.5vw, 5.6rem);
            font-weight: 700;
            line-height: 1.15;
            letter-spacing: clamp(0.06em, 2.2vw, 0.22em);
            text-indent: clamp(0.06em, 2.2vw, 0.22em);
            background: linear-gradient(
                100deg,
                #1a472a 0%,
                #3f7d55 18%,
                #7fb890 32%,
                #2d5f3f 48%,
                #1a472a 62%,
                #4a8a60 78%,
                #1a472a 100%
            );
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: flowText 7s linear infinite;
            filter: drop-shadow(0 3px 8px rgba(26, 71, 42, 0.13));
            transition: letter-spacing 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }
        @keyframes flowText {
            0%   { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }
        .header h1:hover { letter-spacing: clamp(0.1em, 3vw, 0.3em); text-indent: clamp(0.1em, 3vw, 0.3em); }
        .header .subtitle {
            position: relative;
            margin-top: 18px;
            font-size: 1rem;
            color: #7a8a7e;
            letter-spacing: 0.34em;
            text-indent: 0.34em;
            transition: color 0.4s ease, letter-spacing 0.6s ease;
        }
        .header:hover .subtitle {
            color: #1a472a;
            letter-spacing: 0.42em;
            text-indent: 0.42em;
        }
        /* 标题下方流动装饰线 */
        .header .flow-line {
            position: relative;
            width: 180px;
            height: 2px;
            margin: 24px auto 0;
            border-radius: 2px;
            background: linear-gradient(90deg, transparent 0%, #a8c3b0 25%, #1a472a 50%, #a8c3b0 75%, transparent 100%);
            background-size: 200% 100%;
            animation: flowLine 3.5s linear infinite;
        }
        @keyframes flowLine {
            0%   { background-position: 200% 50%; }
            100% { background-position: -200% 50%; }
        }
        .about {
            max-width: 1400px;
            margin: clamp(22px, 3vw, 36px) auto 0;
            padding: 0 clamp(18px, 3vw, 40px);
        }
        .about-inner {
            position: relative;
            background: linear-gradient(120deg, #fdf4f0 0%, #fbeae4 45%, #fdf6f2 100%);
            border-radius: 14px;
            padding: 30px 38px 30px 42px;
            display: flex;
            align-items: center;
            gap: 26px;
            overflow: hidden;
            box-shadow: 0 2px 10px rgba(26, 71, 42, 0.05);
            transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                        box-shadow 0.45s ease,
                        background 0.45s ease;
        }
        /* 左侧渐变竖条 */
        .about-inner::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 5px;
            background: linear-gradient(180deg, #1a472a 0%, #3d7a52 50%, #1a472a 100%);
            transition: width 0.45s cubic-bezier(0.22, 1, 0.36, 1);
        }
        /* 右上角装饰水印 */
        .about-inner::after {
            content: "博";
            position: absolute;
            right: 22px;
            top: 50%;
            transform: translateY(-50%);
            font-family: "Kaiti SC", "STKaiti", "Noto Serif SC", serif;
            font-size: 5.5rem;
            color: #1a472a;
            opacity: 0.045;
            line-height: 1;
            pointer-events: none;
            transition: opacity 0.45s ease, transform 0.45s ease;
        }
        /* 悬浮高亮 */
        .about-inner:hover {
            transform: translateY(-3px);
            background: linear-gradient(120deg, #eaf2e8 0%, #e2ece0 45%, #eff5ec 100%);
            box-shadow: 0 14px 38px rgba(26, 71, 42, 0.16);
        }
        .about-inner:hover::before { width: 9px; }
        .about-inner:hover::after {
            opacity: 0.09;
            transform: translateY(-50%) scale(1.08);
        }
        /* 「关于」艺术字标签 */
        .about-inner .about-label {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            width: 46px;
            padding: 12px 0;
            background: linear-gradient(160deg, #1f5432 0%, #1a472a 100%);
            color: #f4f7f2;
            border-radius: 8px;
            font-family: "Kaiti SC", "STKaiti", "Noto Serif SC", serif;
            font-size: 1.05rem;
            line-height: 1.15;
            letter-spacing: 0.05em;
            box-shadow: 0 4px 12px rgba(26, 71, 42, 0.25),
                        inset 0 0 0 1px rgba(244, 247, 242, 0.22);
            transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                        box-shadow 0.45s ease;
        }
        .about-inner:hover .about-label {
            transform: rotate(-3deg) scale(1.06);
            box-shadow: 0 8px 20px rgba(26, 71, 42, 0.38),
                        inset 0 0 0 1px rgba(244, 247, 242, 0.4);
        }
        /* ============ 说明文字：艺术字（细体流动） ============ */
        .about-inner .about-text {
            position: relative;
            font-family: "Kaiti SC", "STKaiti", "Noto Serif SC", serif;
            font-size: clamp(1rem, 1.9vw, 1.32rem);
            font-weight: 400;
            line-height: 2.1;
            letter-spacing: 0.1em;
            /* 深绿→碧玉→描金 多色渐变，拉长色带增强流动感 */
            background: linear-gradient(
                100deg,
                #1a472a 0%,
                #3f8a5a 10%,
                #8cc9a0 20%,
                #d8bb78 28%,
                #8cc9a0 36%,
                #2f7a4d 48%,
                #1a472a 58%,
                #4a9a68 70%,
                #c9a961 80%,
                #2f7a4d 90%,
                #1a472a 100%
            );
            background-size: 400% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            /* 轻柔描边，不加粗 */
            -webkit-text-stroke: 0.3px rgba(26, 71, 42, 0.32);
            paint-order: stroke fill;
            filter:
                drop-shadow(0 1px 0 rgba(255, 255, 255, 0.8))
                drop-shadow(0 2px 5px rgba(26, 71, 42, 0.16));
            animation: artFlow 6s linear infinite;
            transition: letter-spacing 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }
        @keyframes artFlow {
            0%   { background-position: 0% 50%; }
            100% { background-position: 400% 50%; }
        }
        /* 引号装饰：金色流动 */
        .about-inner .about-text::before {
            content: "「";
            margin-right: 3px;
            background: linear-gradient(100deg, #c9a961 0%, #e8d4a0 50%, #a8863f 100%);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            -webkit-text-stroke: 0;
            filter: none;
            font-size: 1.1em;
            animation: artFlow 5s linear infinite;
        }
        .about-inner .about-text::after {
            content: "」";
            margin-left: 3px;
            background: linear-gradient(100deg, #c9a961 0%, #e8d4a0 50%, #a8863f 100%);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            -webkit-text-stroke: 0;
            filter: none;
            font-size: 1.1em;
            animation: artFlow 5s linear infinite;
        }
        .about-inner:hover .about-text {
            letter-spacing: 0.15em;
        }
        /* 重点句：不加粗，仅换流动色带 */
        .about-inner .about-text strong {
            font-weight: 400;
            background: linear-gradient(
                100deg,
                #1a472a 0%,
                #c9a961 22%,
                #7fbf92 45%,
                #1a472a 68%,
                #c9a961 100%
            );
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: artFlow 4s linear infinite;
        }

        /* ============ 工具栏（搜索 + 筛选，无外框） ============ */
        .toolbar {
            position: relative;
        }
        /* ============ 搜索框 ============ */
        .search-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: clamp(14px, 2vw, 20px) clamp(18px, 3vw, 40px);
        }
        .search-box {
            position: relative;
            width: 100%;
            max-width: 860px;
            min-width: 0;
            display: flex;
            align-items: center;
            background: #fff;
            border: 1px solid #ddd9d0;
            border-radius: 30px;
            transition: border-color 0.32s ease, box-shadow 0.32s ease;
        }
        .search-box:focus-within {
            border-color: #1a472a;
            box-shadow: 0 6px 20px rgba(26, 71, 42, 0.13);
        }
        /* ============ 类型下拉框（内嵌于搜索框左侧） ============ */
        .type-select {
            position: relative;
            flex-shrink: 0;
            align-self: stretch;
            display: flex;
            align-items: center;
        }
        .ts-trigger {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            height: 100%;
            padding: 0 14px 0 18px;
            background: transparent;
            border: none;
            border-right: 1px solid #ece4dd;
            cursor: pointer;
            font-family: "Kaiti SC", "STKaiti", "Noto Serif SC", serif;
            font-size: 0.9rem;
            letter-spacing: 0.1em;
            color: #4a5c50;
            border-radius: 30px 0 0 30px;
            transition: color 0.3s ease, background 0.3s ease;
            white-space: nowrap;
        }
        .ts-trigger:hover { color: #1a472a; background: #fdf2ee; }
        .ts-trigger .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #c9c5bb;
            flex-shrink: 0;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }
        .ts-trigger .dot.t-fuel { background: #b06a2c; }
        .ts-trigger .dot.t-ev   { background: #2c6fa8; }
        .ts-trigger .dot.t-all  { background: #1a472a; }
        .ts-trigger .ts-caret {
            font-size: 0.6rem;
            color: #a8a49a;
            transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1), color 0.3s ease;
            line-height: 1;
        }
        .type-select.open .ts-caret { transform: rotate(180deg); color: #1a472a; }
        /* 下拉面板 */
        .ts-menu {
            position: absolute;
            top: calc(100% + 10px);
            left: 0;
            min-width: 160px;
            padding: 6px;
            background: #fff;
            border: 1px solid #e4e1d9;
            border-radius: 14px;
            box-shadow: 0 14px 34px rgba(26, 71, 42, 0.14);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-6px);
            transition: opacity 0.28s ease, transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.28s;
            z-index: 40;
        }
        .type-select.open .ts-menu {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }
        .ts-option {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 10px 14px;
            background: transparent;
            border: none;
            border-radius: 9px;
            cursor: pointer;
            font-family: "Kaiti SC", "STKaiti", "Noto Serif SC", serif;
            font-size: 0.88rem;
            letter-spacing: 0.1em;
            color: #5c6b62;
            text-align: left;
            transition: background 0.24s ease, color 0.24s ease;
        }
        .ts-option .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #c9c5bb;
            flex-shrink: 0;
            transition: background 0.24s ease;
        }
        .ts-option .count {
            margin-left: auto;
            font-family: "Noto Serif SC", serif;
            font-size: 0.72rem;
            color: #b3b8b2;
            letter-spacing: 0;
        }
        .ts-option:hover { background: #fbeae4; color: #1a472a; }
        .ts-option.active {
            background: linear-gradient(160deg, #1f5432 0%, #1a472a 100%);
            color: #f4f7f2;
        }
        .ts-option.active .dot { background: #9fe0b4; box-shadow: 0 0 7px rgba(159, 224, 180, 0.9); }
        .ts-option.active .count { color: rgba(244, 247, 242, 0.68); }
        .ts-option[data-type="fuel"] .dot { background: #b06a2c; }
        .ts-option[data-type="ev"] .dot { background: #2c6fa8; }
        .ts-option[data-type="all"] .dot { background: #1a472a; }
        .ts-option.active .dot { background: #9fe0b4 !important; }

        .search-box input {
            flex: 1;
            min-width: 0;
            padding: 13px 52px 13px 16px;
            font-family: "Kaiti SC", "STKaiti", "Noto Serif SC", serif;
            font-size: 0.95rem;
            letter-spacing: 0.06em;
            color: #2b3d30;
            background: transparent;
            border: none;
            outline: none;
        }
        .search-box input::placeholder {
            color: #b3b8b2;
            letter-spacing: 0.08em;
        }
        /* 清除按钮 */
        .search-box .s-clear {
            position: absolute;
            right: 14px;
            width: 24px;
            height: 24px;
            display: none;
            align-items: center;
            justify-content: center;
            border: none;
            background: #eef1ec;
            color: #7a8a7e;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.8rem;
            line-height: 1;
            transition: background 0.25s ease, color 0.25s ease, transform 0.25s ease;
        }
        .search-box .s-clear.show { display: flex; }
        .search-box .s-clear:hover {
            background: #1a472a;
            color: #fff;
            transform: rotate(90deg);
        }
        /* 结果计数 */
        .search-bar .s-result {
            margin-left: 14px;
            font-size: 0.78rem;
            color: #8a968c;
            letter-spacing: 0.06em;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .search-bar .s-result.show { opacity: 1; }
        .search-bar .s-result b { color: #1a472a; font-weight: 600; }

        /* ============ 动力类型标签 ============ */
        .type-tag {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 0.72rem;
            letter-spacing: 0.1em;
            font-family: "Kaiti SC", "STKaiti", "Noto Serif SC", serif;
            white-space: nowrap;
        }
        .type-tag::before {
            content: "";
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }
        .type-tag.fuel {
            color: #a8591f;
            background: #fdf1e4;
            border: 1px solid #f0d6bb;
        }
        .type-tag.ev {
            color: #1f5d94;
            background: #e8f2fb;
            border: 1px solid #c3ddf3;
        }
        /* 卡片封面上的标签 */
        .card-cover .type-tag {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 2;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(4px);
            font-size: 0.7rem;
        }
        .card-cover .type-tag.fuel { color: #a8591f; border-color: #e6c8a8; }
        .card-cover .type-tag.ev { color: #1f5d94; border-color: #b4d4ef; }

        /* ============ 网格 ============ */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr));
            gap: clamp(14px, 1.8vw, 24px);
            padding: clamp(18px, 3vw, 40px);
            max-width: 1400px;
            margin: 0 auto;
            transition: opacity 0.3s ease;
        }
        /* 空状态 */
        .empty-tip {
            grid-column: 1 / -1;
            text-align: center;
            padding: 70px 20px;
            color: #a8a49a;
            font-family: "Kaiti SC", "STKaiti", serif;
            font-size: 1rem;
            letter-spacing: 0.15em;
        }
        /* ============ 卡片：透明渐变玻璃 ============ */
        .card {
            position: relative;
            background: linear-gradient(
                145deg,
                rgba(255, 255, 255, 0.72) 0%,
                rgba(252, 240, 235, 0.5) 45%,
                rgba(248, 226, 218, 0.38) 100%
            );
            backdrop-filter: blur(16px) saturate(1.35);
            -webkit-backdrop-filter: blur(16px) saturate(1.35);
            border: 1px solid rgba(255, 255, 255, 0.75);
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            box-shadow:
                0 6px 22px rgba(26, 71, 42, 0.07),
                inset 0 1px 0 rgba(255, 255, 255, 0.85);
            transition: transform 0.42s cubic-bezier(0.22, 1, 0.36, 1),
                        box-shadow 0.42s ease,
                        border-color 0.42s ease,
                        background 0.42s ease;
        }
        /* 卡片内渐变光斑（悬浮时浮现） */
        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 15% 0%, rgba(122, 187, 140, 0.22) 0%, transparent 52%),
                radial-gradient(circle at 88% 8%, rgba(240, 168, 148, 0.26) 0%, transparent 50%),
                radial-gradient(circle at 92% 100%, rgba(26, 71, 42, 0.14) 0%, transparent 55%);
            opacity: 0.55;
            transition: opacity 0.45s ease;
            pointer-events: none;
            z-index: 0;
        }
        .card:hover {
            transform: translateY(-6px);
            background: linear-gradient(
                145deg,
                rgba(255, 255, 255, 0.88) 0%,
                rgba(253, 241, 236, 0.66) 45%,
                rgba(246, 218, 208, 0.5) 100%
            );
            border-color: rgba(26, 71, 42, 0.35);
            box-shadow:
                0 20px 46px rgba(26, 71, 42, 0.18),
                inset 0 1px 0 rgba(255, 255, 255, 0.95);
        }
        .card:hover::before { opacity: 1; }
        .card > * { position: relative; z-index: 1; }

        .card-cover {
            position: relative;
            height: 200px;
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.5) 0%,
                rgba(244, 220, 210, 0.36) 55%,
                rgba(236, 200, 188, 0.28) 100%
            );
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.45s ease;
        }
        .card:hover .card-cover {
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.62) 0%,
                rgba(250, 224, 214, 0.46) 55%,
                rgba(238, 194, 182, 0.36) 100%
            );
        }
        /* 封面与正文的透明分隔渐变 */
        .card-cover::after {
            content: "";
            position: absolute;
            left: 0;

                    <input data-page-node-id="tfYDJC2ApnwJkb8611cKEA" autocomplete="off" id="searchInput" oninput="onSearch(this.value)" placeholder="搜索车型关键词，如 保时捷、比亚迪、Model S" type="text">
                    <button data-page-node-id="HeE1VPbd9nBPok1fsSVenx" class="s-clear" id="searchClear" onclick="clearSearch()" title="清除"><!--pnid:lKxbZ7fiFjKzXlLXceAv0w-->&#10005;</button>

    <script data-page-node-id="kvUlXawyW0w6FaCi4MRKpn" data-pnid-children="3S0YgJXKKlIDWRhYiRHSOp">
        /* ===== 车型数据 ===== */
        const CARS = [
            {
                id: "changan-uni-v",
                type: "fuel",
                icon: "彡",
                name: "长安 UNI-V 2.0T 劲速型",
                brand: "CHANGAN · 中国",
                desc: "蓝鲸新一代 2.0T + 爱信 8AT，11.49 万起的运动轿跑，零百 6.3 秒。",
                price: 11.49,
                img: "https://my-images-1461446070.cos.ap-beijing.myqcloud.com/univ.jpg",
                specs: [
                    ["发动机", "2.0T 蓝鲸新一代"],
                    ["进气形式", "涡轮增压"],
                    ["最大功率", "180 kW（245 马力）"],
                    ["最大扭矩", "400 N·m"],
                    ["变速箱", "爱信 8 速手自一体"],
                    ["驱动形式", "前置前驱"],
                    ["0-100km/h", "6.3 秒"],
                    ["最高时速", "215 km/h"]
                ],
                features: [
                    "蓝鲸新一代 2.0T 发动机，245 马力 + 400N·m，动力充沛",
                    "爱信 8 速手自一体变速箱，换挡平顺可靠",
                    "零百加速 6.3 秒，同级领先",
                    "电动升降尾翼，运动仪式感拉满",
                    "无框车门 + 隐藏电动门把手，轿跑基因",
                    "L2 级智能辅助驾驶，全速域 ACC + 车道保持",
                    "14.6 英寸中控屏 + 10.25 英寸液晶仪表，双屏联动",
                    "540° 全景影像，泊车无忧"
                ],
                verdict: "11.49 万买 245 马力 + 爱信 8AT + 零百 6.3 秒，UNI-V 劲速型是十万级运动轿跑的性能标杆。"
            }
        ];

        /* ===== 类型元信息 ===== */
        const TYPE_META = {
            all:  { label: "全部车型", dotCls: "t-all",  ph: "搜索车型关键词，如 保时捷、比亚迪、Model S" },
            fuel: { label: "燃油车型", dotCls: "t-fuel", ph: "在燃油车型中搜索，如 保时捷、奔驰、凯美瑞", cls: "fuel", tag: "燃油" },
            ev:   { label: "电动车型", dotCls: "t-ev",   ph: "在电动车型中搜索，如 特斯拉、比亚迪、换电", cls: "ev",   tag: "电动" }
        };
        let currentFilter = "all";
        let currentKeyword = "";

        /* ===== 生成类型标签 HTML ===== */
        function typeTagHTML(type, extraClass) {
            const m = TYPE_META[type];
            if (!m || !m.tag) return "";
            return `<span class="type-tag ${m.cls}${extraClass ? " " + extraClass : ""}">${m.tag}</span>`;
        }

        /* ===== 关键词匹配（车型名 / 品牌 / 简介 / 参数值） ===== */
        function matchKeyword(car, kw) {
            if (!kw) return true;
            const hay = [
                car.name, car.brand, car.desc, car.verdict,
                ...car.specs.map(s => s[0] + " " + s[1]),
                ...car.features
            ].join(" ").toLowerCase();
            // 支持空格分词，全部命中才算匹配
            return kw.trim().toLowerCase().split(/\s+/).every(k => hay.includes(k));
        }

        /* ===== 渲染首页卡片 ===== */
        function renderCards() {
            const list = CARS.filter(c =>
                (currentFilter === "all" || c.type === currentFilter) &&
                matchKeyword(c, currentKeyword)
            );
            const grid = document.getElementById("grid");
            const resultEl = document.getElementById("searchResult");
            const clearBtn = document.getElementById("searchClear");

            clearBtn.classList.toggle("show", !!currentKeyword);

            const typeLabel = currentFilter === "all" ? "" : TYPE_META[currentFilter].label;
            if (currentKeyword || currentFilter !== "all") {
                resultEl.innerHTML = `${typeLabel ? typeLabel + " · " : ""}共 <b>${list.length}</b> 款`;
                resultEl.classList.add("show");
            } else {
                resultEl.classList.remove("show");
            }

            if (!list.length) {
                grid.innerHTML = `<p class="empty-tip">没有找到匹配的车型，换个关键词试试</p>`;
                return;
            }
            grid.innerHTML = list.map(c => `
                <article class="card" onclick="openDetail('${c.id}')">
                    <div class="card-cover${c.img ? " has-img" : ""}">
                        ${typeTagHTML(c.type)}
                        ${c.img
                            ? `<img src="${c.img}" alt="${c.name}" loading="lazy" data-icon="${c.icon}">`
                            : `<span class="car-icon">${c.icon}</span>`}
                    </div>
                    <div class="card-body">
                        <h3>${c.name}</h3>
                        <p class="brand">${c.brand}</p>
                        <p class="desc">${c.desc}</p>
                        <div class="specs">
                            ${c.specs.slice(2, 5).map(s => `<span><b>${s[1].split(" ")[0]}</b> ${s[0]}</span>`).join("")}
                        </div>
                        <span class="more">查看详情</span>
                    </div>
                </article>
            `).join("");

            /* 图片加载失败时回退为字符图标 */
            grid.querySelectorAll(".card-cover img").forEach(img => {
                img.addEventListener("error", () => {
                    const cover = img.parentNode;
                    const icon = document.createElement("span");
                    icon.className = "car-icon";
                    icon.textContent = img.dataset.icon || "";
                    img.replaceWith(icon);
                    cover.classList.remove("has-img");
                }, { once: true });
            });
        }

        /* ===== 搜索 ===== */
        function onSearch(val) {
            currentKeyword = val;
            renderCards();
        }
        function clearSearch() {
            document.getElementById("searchInput").value = "";
            currentKeyword = "";
            renderCards();
            document.getElementById("searchInput").focus();
        }

        /* ===== 类型下拉框 ===== */
        function toggleTypeMenu(e) {
            if (e) e.stopPropagation();
            document.getElementById("typeSelect").classList.toggle("open");
        }
        function closeTypeMenu() {
            document.getElementById("typeSelect").classList.remove("open");
        }
        function selectType(type) {
            currentFilter = type;
            const m = TYPE_META[type];
            // 更新触发按钮
            document.getElementById("tsLabel").textContent = m.label;
            const dot = document.getElementById("tsDot");
            dot.className = `dot ${m.dotCls}`;
            // 更新选项选中态
            document.querySelectorAll(".ts-option").forEach(o =>
                o.classList.toggle("active", o.dataset.type === type)
            );
            // 搜索框占位符跟随类型变化
            document.getElementById("searchInput").placeholder = m.ph;
            closeTypeMenu();
            renderCards();
        }
        // 点击外部关闭下拉
        document.addEventListener("click", e => {
            const sel = document.getElementById("typeSelect");
            if (sel && !sel.contains(e.target)) closeTypeMenu();
        });
        document.addEventListener("keydown", e => {
            if (e.key === "Escape") closeTypeMenu();
        });

        /* ===== 初始化导航栏计数 ===== */
        function initNavCounts() {
            document.getElementById("cnt-all").textContent = `(${CARS.length})`;
            document.getElementById("cnt-fuel").textContent = `(${CARS.filter(c => c.type === "fuel").length})`;
            document.getElementById("cnt-ev").textContent = `(${CARS.filter(c => c.type === "ev").length})`;

            /* 无对应车型的类型：隐藏该选项，避免空筛选 */
            document.querySelectorAll(".ts-option").forEach(opt => {
                const t = opt.dataset.type;
                const n = t === "all" ? CARS.length : CARS.filter(c => c.type === t).length;
                opt.style.display = n === 0 ? "none" : "";
            });
        }

        /* ===== 打开详情页 ===== */
        function openDetail(id) {
            const c = CARS.find(x => x.id === id);
            if (!c) return;
            const m = TYPE_META[c.type];
            document.getElementById("crumb").textContent = `首页 / ${m.tag}车型 / ${c.name}`;
            document.getElementById("d-top-tag").innerHTML = typeTagHTML(c.type);
            const heroTag = document.getElementById("d-hero-tag");
            heroTag.className = `type-tag ${m.cls}`;
            heroTag.textContent = m.tag;
            document.getElementById("d-name-tag").innerHTML = typeTagHTML(c.type);
            document.getElementById("d-icon").textContent = c.icon;
            /* 主视觉：有图则用图，无图用字符图标 */
            const heroBox = document.getElementById("d-hero-visual");
            const oldImg = heroBox.querySelector("img");
            if (oldImg) oldImg.remove();
            if (c.img) {
                const img = document.createElement("img");
                img.src = c.img;
                img.alt = c.name;
                img.onerror = () => {
                    img.remove();
                    heroBox.classList.remove("has-img");
                };
                heroBox.insertBefore(img, heroBox.firstChild);
                heroBox.classList.add("has-img");
            } else {
                heroBox.classList.remove("has-img");
            }
            document.getElementById("d-brand").textContent = c.brand;
            document.getElementById("d-name").textContent = c.name;
            document.getElementById("d-desc").textContent = c.desc;
            document.getElementById("d-price").innerHTML = `官方指导价 <b>¥${c.price}</b> 万元起`;
            document.getElementById("d-specs").innerHTML = c.specs.map(s => `
                <div class="spec-cell"><span class="k">${s[0]}</span><span class="v">${s[1]}</span></div>
            `).join("");
            document.getElementById("d-features").innerHTML = c.features.map(f => `<li>${f}</li>`).join("");
            document.getElementById("d-verdict").textContent = c.verdict;

            document.getElementById("view-home").classList.remove("active");
            document.getElementById("view-detail").classList.add("active");
            window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
        }

        /* ===== 返回首页 ===== */
        function goHome() {
            document.getElementById("view-detail").classList.remove("active");
            document.getElementById("view-home").classList.add("active");
            window.scrollTo({ top: 0, behavior: "auto" });
        }

        /* ===== 浏览器后退键支持 ===== */
        window.addEventListener("popstate", () => {
            if (document.getElementById("view-detail").classList.contains("active")) goHome();
        });

        renderCards();
        initNavCounts();
    </script>
