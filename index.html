<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>加载中…</title>
  <style>
    body{margin:0;font-family:-apple-system,"Microsoft YaHei",sans-serif;background:#faf7f2;color:#2c3e50;display:flex;align-items:center;justify-content:center;min-height:100vh;}
    .box{text-align:center;padding:40px;}
    .box h1{font-size:22px;margin:0 0 12px;}
    .box p{color:#5a6c7d;margin:0;}
  </style>
</head>
<body>
  <div class="box">
    <p>正在加载…</p>
  </div>
  <script>
    (function () {
      function allow() {
        location.replace('./mysql-notes.html');
      }
      function deny() {
        document.title = '禁止访问';
        document.body.innerHTML =
          '<div class="box" style="margin:auto">' +
          '<h1>禁止访问</h1>' +
          '<p>该网站仅限中国大陆访问。</p>' +
          '</div>';
      }
      // 优先用 ipwho.is（免费、支持 HTTPS/CORS、无 key）
      fetch('https://ipwho.is/')
        .then(function (r) { return r.json(); })
        .then(function (d) {
          var isCN = (d.country_code === 'CN') || (d.country === 'CN');
          isCN ? allow() : deny();
        })
        .catch(function () {
          // 地理位置接口异常时放行，避免误伤国内访客
          allow();
        });
    })();
  </script>
</body>
</html>
